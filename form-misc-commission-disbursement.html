<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commission Disbursement Form — Miscellaneous Sale</title>
  <style>
    @page { size: letter; margin: 0.6in; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #000; background: #fff; }

    .print-btn {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      padding: 8px 18px; background: #003366; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    @media print { .print-btn { display: none !important; } }

    .form-title {
      text-align: center; font-size: 14pt; font-weight: bold;
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px;
    }
    .form-subtitle {
      text-align: center; font-size: 9.5pt; color: #444;
      margin-bottom: 16px;
    }

    table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    td, th { border: 1px solid #000; padding: 4px 6px; vertical-align: top; font-size: 9pt; }
    td.label {
      background: #eee; font-weight: bold; font-size: 8pt;
      text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; width: 1%; padding-right: 8px;
    }
    td.val { min-width: 100px; }

    .section-head {
      background: #003366; color: #fff; font-weight: bold;
      font-size: 9pt; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 4px 8px; margin-top: 10px; margin-bottom: 2px;
    }

    .disbursement-table td { padding: 5px 8px; }
    .disbursement-table td.amt { text-align: right; min-width: 90px; }
    .disbursement-table tr.total-row td { font-weight: bold; border-top: 2px solid #000; }

    .work-table th {
      background: #eee; font-weight: bold; font-size: 8pt;
      text-transform: uppercase; letter-spacing: 0.03em; text-align: center;
    }
    .work-table td { height: 22px; }

    .sig-row { display: flex; gap: 24px; margin-top: 20px; }
    .sig-block { flex: 1; border-top: 1px solid #000; padding-top: 4px; font-size: 8pt; }

    .loading { text-align: center; padding: 60px; font-size: 14px; color: #666; }
    .error   { text-align: center; padding: 60px; color: #c00; font-size: 14px; }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">Print</button>
  <div id="content"><div class="loading">Loading…</div></div>

<script>
const PROXY = 'https://mls-proxy-975684028597.us-east1.run.app';
const CATEGORY_LABELS = {
  referral: 'Referral Fee',
  cancellation_fee: 'Listing Cancellation Fee',
  bpo_consultation: 'BPO / Consultation Fee',
  other: 'Other',
};

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('content').innerHTML = '<div class="error">No record ID in URL.</div>'; return; }

  const email = localStorage.getItem('ac_user_email') || '';
  const proxyKey = localStorage.getItem('ac_proxy_key') || '';
  const headers = { 'Content-Type': 'application/json', 'x-proxy-key': proxyKey, 'x-user-email': email };

  try {
    const res = await fetch(PROXY + `/daily-desk/misc-commissions/${encodeURIComponent(id)}`, { headers });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function fmt(v) { return v || ''; }
function fmtMoney(v) { return v != null ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''; }
function fmtDate(v) { if (!v) return ''; const d = new Date(String(v).slice(0, 10) + 'T00:00:00'); return d.toLocaleDateString('en-US'); }
function esc(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function row2(l1, v1, l2, v2) {
  return `<tr>
    <td class="label">${l1}</td><td class="val">${v1 || '&nbsp;'}</td>
    <td class="label">${l2}</td><td class="val">${v2 || '&nbsp;'}</td>
  </tr>`;
}

function render(r) {
  const agentName = [r.first_name, r.last_name].filter(Boolean).join(' ');
  document.getElementById('content').innerHTML = `
    <div class="form-title">Commission Disbursement Form</div>
    <div class="form-subtitle">Miscellaneous Sale — not tied to a property transaction</div>

    <table>
      ${row2('Agent', esc(agentName), 'Office', esc(r.office_name))}
      ${row2('Category', CATEGORY_LABELS[r.category] || esc(r.category), 'Date', fmtDate(r.sale_date))}
    </table>

    <div class="section-head">Description</div>
    <table>
      <tr><td style="min-height:40px">${esc(r.description)}</td></tr>
    </table>

    <div class="section-head">Commission Split</div>
    <table class="work-table">
      <thead>
        <tr><th style="width:30%">Agent</th><th style="width:10%">%</th><th style="width:18%">$</th><th style="width:14%">Ck#</th><th style="width:14%">Date</th><th style="width:14%">NSC</th></tr>
      </thead>
      <tbody>
        <tr><td>${esc(agentName)}</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      </tbody>
    </table>

    <div class="section-head">Commission Summary</div>
    <table class="disbursement-table">
      <tr class="total-row">
        <td>${CATEGORY_LABELS[r.category] || 'Miscellaneous'} — Gross Commission Income (GCI)</td>
        <td class="amt">${fmtMoney(r.amount)}</td>
        <td style="width:50%; font-size:8pt; color:#555;">No sale price, no Foundation contribution — this is a one-off fee, not a closing.</td>
      </tr>
    </table>

    <div class="sig-row">
      <div class="sig-block">Coordinator Signature</div>
      <div class="sig-block">Date</div>
    </div>
    <div style="margin-top:14px; font-size:7.5pt; color:#888;">
      Record created by ${esc(r.created_by_name)} on ${fmtDate(r.created_at)}
    </div>
  `;
}

load();
</script>
</body>
</html>
