<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Listing / Contract Form</title>
  <style>
    @page { size: letter; margin: 0.4in; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #000; background: #fff; }

    .print-btn {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      padding: 8px 18px; background: #003366; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    @media print { .print-btn, .screen-only { display: none !important; } }

    .form-title {
      text-align: center; font-size: 13pt; font-weight: bold;
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px;
    }
    .company-line {
      text-align: center; font-size: 8pt; color: #444; margin-bottom: 8px;
    }

    table { width: 100%; border-collapse: collapse; margin-bottom: 3px; }
    td { border: 1px solid #000; padding: 2px 6px; vertical-align: top; font-size: 8pt; }
    td.label {
      background: #eee; font-weight: bold; font-size: 7.5pt;
      text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; width: 1%; padding-right: 8px;
    }
    td.val { min-width: 100px; }
    .blank { display: inline-block; border-bottom: 1px solid #555; min-width: 120px; }

    .section-head {
      background: #003366; color: #fff; font-weight: bold;
      font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 8px; margin-top: 4px; margin-bottom: 1px;
    }

    .sig-row { display: flex; gap: 24px; margin-top: 12px; }
    .sig-block { flex: 1; border-top: 1px solid #000; padding-top: 3px; font-size: 7.5pt; }

    .form-header { position: relative; margin-bottom: 8px; }
    .scenario-badge {
      position: absolute; top: 0; right: 0;
      border: 2px solid #003366; border-radius: 3px;
      padding: 3px 10px; color: #003366;
      font-weight: bold; font-size: 10pt;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .loading { text-align: center; padding: 60px; font-size: 14px; color: #666; }
    .error   { text-align: center; padding: 60px; color: #c00; font-size: 14px; }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">Print</button>
  <div id="content"><div class="loading">Loading…</div></div>

<script>
const PROXY = 'https://mls-proxy-975684028597.us-east1.run.app';

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('content').innerHTML = '<div class="error">No transaction ID in URL.</div>'; return; }

  const email = localStorage.getItem('ac_user_email') || '';
  const headers = { 'Content-Type': 'application/json', 'x-user-email': email };

  try {
    const res = await fetch(PROXY + `/api/forms/transaction/${encodeURIComponent(id)}`, { headers });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function fmt(v) { return v || ''; }
function fmtMoney(v) { return v != null ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2 }) : ''; }
function fmtDate(v) { if (!v) return ''; const d = new Date(String(v).slice(0, 10) + 'T00:00:00'); return d.toLocaleDateString('en-US'); }
function agentName(a) { if (!a) return ''; return [a.first_name, a.last_name].filter(Boolean).join(' '); }
// "Agent #" on the paper form was the agent's Profit Power ID — only
// meaningful for our own (ACC) agents. An external co-broke agent has no
// pp_id at all, so the form showed "Co-Broke" in that slot instead.
function agentNumber(a) { if (!a) return ''; return a.is_acc_agent ? fmt(a.pp_id) : 'Co-Broke'; }
function splitLabel(a) { return a && a.commission_split != null ? ` — ${a.commission_split}%` : ''; }

// Renders every agent on a side (listing or buyer), not just one — a 3+ way
// split inserts multiple participant rows with the same role (e.g. two
// co_listing_agent rows). Email/office/NRDS aren't needed on this form; an
// external (non-ACC) agent has no Agent # in our system, so their brokerage
// is shown instead — agent_office already resolves to the external brokerage
// name for those rows (see the /api/forms/transaction/:id query).
function agentSection(sectionLabel, list) {
  if (!list.length) {
    return `<div class="section-head">${sectionLabel}</div><table>${row2('Name', '', 'Agent #', '')}</table>`;
  }
  const rows = list.map(a => {
    const brokerageRow = !a.is_acc_agent && a.agent_office
      ? row2('Brokerage', fmt(a.agent_office), '', '')
      : '';
    return row2('Name', agentName(a) + splitLabel(a), 'Agent #', agentNumber(a)) + brokerageRow;
  }).join('');
  return `
    <div class="section-head">${sectionLabel}</div>
    <table>${rows}</table>`;
}

function row(label, ...vals) {
  const cells = vals.map(([w, v]) => `<td class="val" style="width:${w}">${v || '&nbsp;'}</td>`).join('');
  return `<tr><td class="label">${label}</td>${cells}</tr>`;
}
function row2(l1, v1, l2, v2) {
  return `<tr>
    <td class="label">${l1}</td><td class="val">${v1 || '&nbsp;'}</td>
    <td class="label">${l2}</td><td class="val">${v2 || '&nbsp;'}</td>
  </tr>`;
}

function customerBlock(label, c) {
  return `
    <div class="section-head">${label}</div>
    <table>
      ${row2('Name', fmt(c?.name), 'Phone', fmt(c?.phone))}
      ${row2('Email', fmt(c?.email), 'Mailing Address', fmt(c?.address))}
      ${row2('City', fmt(c?.city), 'Zip', fmt(c?.zip))}
    </table>`;
}
function customerSections(label, list) {
  if (!list.length) return customerBlock(label, null);
  return list.map((c, i) => customerBlock(list.length > 1 ? `${label} ${i + 1}` : label, c)).join('');
}

// "Referred By" depends on referral_type: an in-house (acc_agent) referral
// joins to agents via agent_id (first_name/last_name merged onto the row by
// /api/forms/transaction/:id's query); referral_dept/realty_referral/other
// store the name as free text instead.
function referralName(r) { return r.referral_type === 'acc_agent' ? agentName(r) : fmt(r.referral_name); }
function referralFee(r) { return r.fee_value != null ? (r.fee_type === 'fixed' ? fmtMoney(r.fee_value) : Number(r.fee_value) + '%') : ''; }
function referralBlock(label, r) {
  return `
    <div class="section-head">${label}</div>
    <table>
      ${row2('Referred By', referralName(r), 'Fee', referralFee(r))}
      ${row2('Company', fmt(r.referral_company), 'Address', fmt(r.referral_address))}
    </table>`;
}
function referralSection(list) {
  if (!list.length) {
    return `
      <div class="section-head">Referral (if applicable)</div>
      <table>
        <tr><td class="label">Referred By</td><td class="val">&nbsp;</td><td class="label">Referral %</td><td class="val">&nbsp;</td></tr>
        <tr><td class="label">Referred To</td><td class="val">&nbsp;</td><td class="label">Address</td><td class="val">&nbsp;</td></tr>
      </table>`;
  }
  return list.map((r, i) => {
    const sideLabel = r.side === 'buyer' ? 'Buyer-Side Referral' : 'Seller-Side Referral';
    return referralBlock(list.length > 1 ? `${sideLabel} ${i + 1}` : sideLabel, r);
  }).join('');
}

function scenarioLabel(t) {
  const seller = t.represents_seller;
  const buyer  = t.represents_buyer;
  const s      = t.status;
  if (seller && !buyer) {
    if (s === 'under_contract') return 'Listing — Under Contract';
    if (s === 'closed')         return 'Listing — Closed';
    return 'New Listing';
  }
  if (buyer && !seller) {
    if (s === 'closed') return 'Buyer Contract — Closed';
    return 'Buyer-Side Contract';
  }
  // dual / in-house
  if (s === 'closed')         return 'In-House Sale — Closed';
  if (s === 'under_contract') return 'In-House Contract';
  return 'In-House Listing';
}

function render({ transaction: t, mls_number, listing_agents, buyer_agents, closing_event, contract_event, customers, referrals }) {
  const badge = scenarioLabel(t);
  const custs = customers || [];
  const sellers = custs.filter(c => c.role === 'seller');
  const buyers  = custs.filter(c => c.role === 'buyer');

  document.getElementById('content').innerHTML = `
    <div class="form-header">
      <div class="form-title">Listing / Contract Form</div>
      <div class="company-line">Adams, Cameron &amp; Co. — Internal Record</div>
      <span class="scenario-badge">${badge}</span>
    </div>

    <div class="section-head">Property Information</div>
    <table>
      ${row2('Property Address', fmt(t.property_address), 'City', fmt(t.city))}
      ${row2('Zip', fmt(t.zip), 'Property Type', fmt(t.property_type))}
      ${row2('Bed/Bath', (t.bedrooms != null || t.bathrooms != null) ? `${fmt(t.bedrooms)} / ${fmt(t.bathrooms)}` : '', 'MLS Number', fmt(mls_number))}
      ${row2('Office', fmt(t.office_name), 'List Price', fmtMoney(t.current_price))}
      ${row2('List Date', fmtDate(t.list_date), 'Expiration Date', fmtDate(t.expiration_date))}
    </table>

    <div class="section-head">Contract</div>
    <table>
      ${row2('Contract Price', fmtMoney(contract_event?.contract_price), 'Contract Date', fmtDate(contract_event?.contract_date))}
      ${row2('Expected Close Date', fmtDate(contract_event?.close_date), 'Actual Close Date', fmtDate(closing_event?.close_date))}
    </table>

    <div class="section-head">Commission</div>
    <table>
      ${row2('Total Commission', t.commission_rate != null ? (t.commission_type === 'fixed' ? '$' + t.commission_rate : t.commission_rate + '%') : '', 'Buyer Broker Commission', t.cooperating_commission != null ? (t.commission_type === 'fixed' ? '$' + t.cooperating_commission : t.cooperating_commission + '%') : '')}
    </table>

    ${customerSections('Seller / Landlord', sellers)}

    ${customerSections('Buyer / Tenant', buyers)}

    ${agentSection('Listing Agent', listing_agents || [])}

    ${agentSection("Buyer's Agent", buyer_agents || [])}

    ${referralSection(referrals || [])}

    <div class="section-head">Source</div>
    <table>
      ${row2('Source of Seller', fmt(t.source_of_seller), 'Source of Buyer', fmt(t.source_of_buyer))}
    </table>

    <div class="sig-row" style="margin-top:24px;">
      <div class="sig-block">Coordinator Signature</div>
      <div class="sig-block">Date</div>
      <div class="sig-block">Agent Signature</div>
      <div class="sig-block">Date</div>
    </div>
  `;
}

load();
</script>
</body>
</html>
