// Convert RESO API response to unified form
const resoToForm = (data) => {
  const form = {};
  for (const [resoKey, formKey] of Object.entries(RESO_TO_FORM)) {
    const v = data[resoKey];
    if (v === undefined || v === null || v === "") continue;

    if (Array.isArray(v)) {
      // Already an array — join for display
      form[formKey] = v.length ? v : null;
    } else if (typeof v === "boolean") {
      form[formKey] = v ? "Yes" : "No";
    } else {
      const s = String(v).trim();
      if (!s) continue;
      // Spark sometimes returns multi-value fields as comma- or pipe-separated strings
      // Keep as-is for display; the form shows them joined with "; " anyway
      form[formKey] = s;
    }
  }
  return form;
};

// ─── API service factories ─────────────────────────────────────────────
// Every call goes to the Workshop API (Auth.API) with the shared sign-in
// (auth.js). The Stellar (Bridge) and Daytona (Spark) API tokens are added by
// the server's /bridge and /spark routes — the token arguments below are
// left over from when each browser held them, and are ignored.

function proxyHeaders(proxySecret, extra = {}) {
  return Auth.headers({ "Accept": "application/json", ...extra });
}

// ─── Bridge API (Stellar MLS) ─────────────────────────────────────────────
const bridgeAPI = {
  base(proxyUrl) { return `${Auth.API}/bridge`; },

  async searchByAddress(token, dataSystem, address, proxyUrl, proxySecret) {
    const parts = address.trim().split(" ");
    const streetName = parts.slice(1).join(" ").toUpperCase();
    const officeFilter = STELLAR_OFFICE_KEYS.map(k => `ListOfficeMlsId eq '${k}'`).join(" or ");
    const filter = `StreetNumber eq '${parts[0]}' and contains(StreetName,'${streetName}') and (${officeFilter})`;
    const url = `${this.base(proxyUrl)}/${dataSystem}/Properties?$filter=${encodeURIComponent(filter)}&$top=25&access_token=${token}`;
    const r = await fetch(url, { headers: proxyHeaders(proxySecret) });
    if (!r.ok) throw new Error(`Bridge ${r.status}`);
    return (await r.json()).value || [];
  },

  async searchByMlsId(token, dataSystem, mlsId, proxyUrl, proxySecret) {
    const url = `${this.base(proxyUrl)}/${dataSystem}/Properties?$filter=${encodeURIComponent(`ListingId eq '${mlsId}'`)}&$top=1&access_token=${token}`;
    const r = await fetch(url, { headers: proxyHeaders(proxySecret) });
    if (!r.ok) throw new Error(`Bridge ${r.status}`);
    return (await r.json()).value?.[0] || null;
  },

  async searchPublicRecordsByAddress(token, address, proxyUrl, proxySecret) {
    const parts = address.trim().split(" ");
    const streetName = parts.slice(1).join(" ").toUpperCase();
    const filter = `StreetNumber eq '${parts[0]}' and contains(StreetName,'${streetName}')`;
    const url = `${this.base(proxyUrl)}/pub/Properties?$filter=${encodeURIComponent(filter)}&$top=5&access_token=${token}`;
    const r = await fetch(url, { headers: proxyHeaders(proxySecret) });
    if (!r.ok) throw new Error(`Bridge Public Records ${r.status}`);
    return (await r.json()).value || [];
  },

  async searchPublicRecords(token, parcel, proxyUrl, proxySecret) {
    const url = `${this.base(proxyUrl)}/public_records/Properties?$filter=${encodeURIComponent(`ParcelNumber eq '${parcel}'`)}&$top=1&access_token=${token}`;
    const r = await fetch(url, { headers: proxyHeaders(proxySecret) });
    if (!r.ok) throw new Error(`Bridge ${r.status}`);
    return (await r.json()).value?.[0] || null;
  },

  async getOfficeListings(token, dataSystem, officeKey, proxyUrl, proxySecret) {
    const filter = officeKey.startsWith("KEY:")
      ? `StandardStatus eq 'Active' and ListOfficeMlsId eq '${officeKey.slice(4)}'`
      : `StandardStatus eq 'Active' and contains(ListOfficeName,'${officeKey}')`;
    const select = "ListingId,StreetNumber,StreetName,StreetSuffix,UnitNumber,City,StandardStatus,ListPrice,BedroomsTotal,BathroomsFull,ParcelNumber,ListAgentFullName";
    const headers = proxyHeaders(proxySecret);
    let all = [];
    let url = `${this.base(proxyUrl)}/${dataSystem}/Properties?$filter=${encodeURIComponent(filter)}&$top=200&$select=${select}&access_token=${token}`;
    while (url && all.length < 2000) {
      const r = await fetch(url, { headers });
      if (!r.ok) throw new Error(`Bridge ${r.status}`);
      const json = await r.json();
      all = all.concat(json.value || []);
      const next = json["@odata.nextLink"];
      if (next) {
        url = next.replace("https://api.bridgedataoutput.com/api/v2/OData", this.base(proxyUrl));
      } else { url = null; }
    }
    return all;
  },
};

const sparkAPI = {
  base(proxyUrl) {
    // Bearer token is already scoped to the feed — no feedId needed in the path
    return `${Auth.API}/spark`;
  },

  headers(proxySecret, token) {
    // The server adds the Spark token; Authorization carries the sign-in session.
    return proxyHeaders();
  },

  async searchByAddress(token, address, proxyUrl, proxySecret, feedId) {
    const parts = address.trim().split(" ");
    const streetName = parts.slice(1).join(" ").replace(/\b\w/g, c => c.toUpperCase());
    const filter = `StreetNumber eq '${parts[0]}' and contains(StreetName,'${streetName}')`;
    const url = `${this.base(proxyUrl)}/Property?$filter=${encodeURIComponent(filter)}&$top=5`;
    const r = await fetch(url, { headers: this.headers(proxySecret, token) });
    if (!r.ok) throw new Error(`Spark ${r.status}`);
    return (await r.json()).value || [];
  },

  async searchByMlsId(token, mlsId, proxyUrl, proxySecret, feedId) {
    const url = `${this.base(proxyUrl)}/Property?$filter=${encodeURIComponent(`ListingId eq '${mlsId}'`)}&$top=1`;
    const r = await fetch(url, { headers: this.headers(proxySecret, token) });
    if (!r.ok) throw new Error(`Spark ${r.status}`);
    return (await r.json()).value?.[0] || null;
  },

  async getOfficeListings(token, officeName, proxyUrl, proxySecret, feedId) {
    // The replication feed is already scoped to Adams Cameron — just filter by status
    const filter = "StandardStatus eq 'Active'";
    const select = "ListingId,StreetNumber,StreetName,StreetSuffix,UnitNumber,City,StandardStatus,ListPrice,BedroomsTotal,BathroomsFull,ParcelNumber,ListAgentFullName";
    const headers = this.headers(proxySecret, token);
    const baseUrl = this.base(proxyUrl);
    let all = [];
    let url = `${baseUrl}/Property?$filter=${encodeURIComponent(filter)}&$select=${select}&$top=200`;
    while (url && all.length < 2000) {
      const r = await fetch(url, { headers });
      if (!r.ok) {
        const body = await r.text().catch(() => '');
        throw new Error(`Spark ${r.status}: ${body.slice(0, 200)}`);
      }
      const json = await r.json();
      all = all.concat(json.value || []);
      const next = json["@odata.nextLink"];
      if (next) {
        // Replace the full Spark replication base with our proxy base
        url = next.replace(/https:\/\/replication\.sparkapi\.com\/[^?]+\/OData/, baseUrl.replace(/\/Property.*/, ''));
      } else { url = null; }
    }
    return all;
  },
};

// ─── Address key for cross-system matching ────────────────────────────────
// Since Stellar and DBAR are independent systems with no shared IDs,
// we match listings by normalized street address (number + name + city).
// Parcel number is used as a secondary match when available.
//
// ⚠️  KEEP IN SYNC with listing-match-utils.js on the server.
// The scheduler and any server-side crosscheck routes use that module.
// If you change normalization rules here, apply the same change there.
const addressKey = (l) => {
  const num = (l.StreetNumber || "").toString().trim();
  // Normalize: uppercase, strip suffix words (including when baked into StreetName), collapse spaces
  const name = (l.StreetName || "").trim().toUpperCase()
    .replace(/\b(STREET|ST|AVENUE|AVE|DRIVE|DR|ROAD|RD|LANE|LN|COURT|CT|CIRCLE|CIR|BOULEVARD|BLVD|WAY|PLACE|PL|TRAIL|TRL|LOOP|TERRACE|TER)\b/g, "")
    .replace(/\s+/g, " ").trim();
  // Include unit number so condo units at the same building address are not collapsed into one match
  const unit = (l.UnitNumber || "").toString().trim().toUpperCase();
  // Normalize city: strip trailing words that vary between systems
  const city = (l.City || "").trim().toUpperCase()
    .replace(/\b(BEACH|SHORES|SPRINGS|HEIGHTS)\b/g, "")
    .replace(/\s+/g, " ").trim();
  return `${num}|${name}|${unit}|${city}`;
};

function SearchImport({ settings, onImport, onOpenSheets }) {
  const [modeState, setMode] = useState("address"); // address | mlsid | parcel
  const [queryState, setQuery] = useState("");
  const [systemState, setSystem] = useState("stellar");
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(null);
  const [error, setError] = useState("");
  const [imported, setImported] = useState(null);
  const mode = modeState, query = queryState, system = systemState;

  // opts lets the deep link (?search=…&source=…) search before its state has rendered;
  // returns the listing found by MLS ID, if any.
  const handleSearch = async (opts = {}) => {
    const system = opts.system || systemState, mode = opts.mode || modeState;
    const query = opts.query != null ? opts.query : queryState;
    let found = null;
    setLoading(true);
    setError("");
    setResults([]);
    setSelected(null);
    setImported(null);

    const isStellar = system === "stellar";
    const isPublic = system === "public";
    const hasKey = true;  // the server holds the Stellar and Daytona tokens

    try {
      if (!hasKey && !isPublic) {
        // Demo mode
        await new Promise(r => setTimeout(r, 900));
        if (mode === "mlsid" && query.toLowerCase().includes("o621")) {
          setSelected(MOCK_LISTING);
        } else if (mode === "address" && query.toLowerCase().includes("hal")) {
          setResults([MOCK_LISTING]);
        } else {
          setError("No results found. (Demo: try 'Halifax' or MLS# 'O6218734')");
        }
      } else if (isPublic) {
        // Public Records via Bridge API — properties not necessarily in MLS
        if (mode === "address") {
          const r = await bridgeAPI.searchPublicRecordsByAddress(settings.bridgeToken, query, settings.proxyUrl, settings.proxySecret);
          if (r.length > 0) setResults(r); else setError("No public records found for that address.");
        } else {
          setError("Public Records only supports address search.");
        }
      } else if (isStellar) {
        // Stellar MLS via Bridge API
        const dsKey = settings.stellarDsKey || "stellar";
        if (mode === "address") {
          const r = await bridgeAPI.searchByAddress(settings.bridgeToken, dsKey, query, settings.proxyUrl, settings.proxySecret);
          if (r.length > 0) setResults(r); else setError("No Stellar MLS listings found for that address.");
        } else if (mode === "mlsid") {
          const r = await bridgeAPI.searchByMlsId(settings.bridgeToken, dsKey, query, settings.proxyUrl, settings.proxySecret);
          if (r) { setSelected(r); found = r; } else setError("MLS ID not found in Stellar MLS.");
        }
      } else {
        // DBAR via Spark API (Flexmls)
        if (mode === "address") {
          const r = await sparkAPI.searchByAddress(settings.sparkToken, query, settings.proxyUrl, settings.proxySecret, settings.sparkFeedId);
          if (r.length > 0) setResults(r); else setError("No DBAR listings found for that address.");
        } else if (mode === "mlsid") {
          const r = await sparkAPI.searchByMlsId(settings.sparkToken, query, settings.proxyUrl, settings.proxySecret, settings.sparkFeedId);
          if (r) { setSelected(r); found = r; } else setError("MLS ID not found in Daytona DBAR.");
        } else {
          setError("Parcel search is not available for DBAR via Spark API. Try searching by address instead.");
        }
      }
    } catch (e) {
      setError(`API Error: ${e.message}`);
    }
    setLoading(false);
    return found;
  };

  const handleImport = (listing, sys = system) => {
    const formData = resoToForm(listing);
    // Stamp system-specific IDs — these vary per MLS and must not be shared
    // ListingAgreement is not returned by Bridge API — default to most common value
    if (sys === "stellar" || sys === "public") {
      if (!formData.listingType) {
        formData.listingType = "Exclusive Right to Sell";
        formData._listingTypeAssumed = "true";
      }
      if (listing.ListingId)     formData.stellarListingId = String(listing.ListingId);
      if (listing.ListAgentMlsId) formData.stellarAgentId  = String(listing.ListAgentMlsId);
      if (listing.ListOfficeMlsId) formData.stellarOfficeId = String(listing.ListOfficeMlsId);
      if (listing.ListOfficePhone) formData.stellarOfficePhone = String(listing.ListOfficePhone);
    } else {
      if (listing.ListingId)     formData.dbarListingId = String(listing.ListingId);
      if (listing.ListAgentMlsId) formData.dbarAgentId  = String(listing.ListAgentMlsId);
      if (listing.ListOfficeMlsId) formData.dbarOfficeId = String(listing.ListOfficeMlsId);
      if (listing.ListOfficePhone) formData.dbarOfficePhone = String(listing.ListOfficePhone);
    }
    // Shared agent fields (name, email, phone are the same person regardless of system)
    // Open the input sheet for the other MLS — the one it's being entered into
    // (same rule as the Cross-System Report). Public records start on Stellar.
    formData._defaultFormTab = sys === "stellar" ? "daytona" : "stellar";
    setImported(formData);
    onImport(formData, listing);
  };

  // Deep link from the nightly crosscheck email and Agent Hub's MLS Gap rows:
  // ?search=<MLS#>&source=stellar|daytona — look it up, import it, open the input sheets.
  // The parameters are cleared so returning to this tab doesn't import it again.
  useEffect(() => {
    const p = new URLSearchParams(location.search);
    const q = (p.get("search") || "").trim();
    if (!q) return;
    const sys = p.get("source") === "daytona" ? "daytona" : "stellar";
    p.delete("search"); p.delete("source");
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "") + location.hash);
    setMode("mlsid"); setSystem(sys); setQuery(q);
    handleSearch({ mode: "mlsid", system: sys, query: q }).then(listing => {
      if (listing) { handleImport(listing, sys); if (onOpenSheets) onOpenSheets(); }
    });
  }, []);

  const placeholders = {
    address: "e.g. 835 Halifax",
    mlsid: "e.g. O6218734",
  };

  return (
    <div>
      <SectionTitle icon="🔍" children="Search & Import" sub="Pull property data from Bridge API public records or an existing MLS listing to auto-populate both forms" />

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px", marginBottom: "20px" }}>
        <Card>
          <div style={{ fontSize: "12px", fontWeight: "700", color: "#475569", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "12px" }}>Search Method</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
            {[
              { id: "address", label: "🏠 Street Address", desc: "Search by property address" },
              { id: "mlsid", label: "📋 MLS Listing ID", desc: "Pull existing active listing" },
            ].map(m => (
              <button key={m.id} onClick={() => setMode(m.id)} style={{
                background: mode === m.id ? colors.navy : "#f8fafc",
                color: mode === m.id ? "white" : "#475569",
                border: mode === m.id ? "none" : "1px solid #e2e8f0",
                borderRadius: "8px",
                padding: "10px 14px",
                textAlign: "left",
                cursor: "pointer",
                fontFamily: "Georgia, serif",
              }}>
                <div style={{ fontSize: "13px", fontWeight: "700" }}>{m.label}</div>
                <div style={{ fontSize: "11px", opacity: 0.8, marginTop: "2px" }}>{m.desc}</div>
              </button>
            ))}
          </div>
        </Card>

        <Card>
          <div style={{ fontSize: "12px", fontWeight: "700", color: "#475569", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "12px" }}>Source System</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "16px" }}>
            {[
              { id: "stellar", label: "⭐ Stellar MLS", color: colors.stellar },
              { id: "daytona", label: "🌊 Daytona DBAR", color: colors.daytona },
            ].map(s => (
              <button key={s.id} onClick={() => setSystem(s.id)} style={{
                background: system === s.id ? s.color + "15" : "#f8fafc",
                color: system === s.id ? s.color : "#475569",
                border: `2px solid ${system === s.id ? s.color : "#e2e8f0"}`,
                borderRadius: "8px",
                padding: "8px 14px",
                textAlign: "left",
                cursor: "pointer",
                fontFamily: "Georgia, serif",
                fontSize: "13px",
                fontWeight: "600",
              }}>{s.label}</button>
            ))}

      </div>

      <Card style={{ marginBottom: "20px" }}>
        <div style={{ display: "flex", gap: "10px", alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}>
            <Input
              label={`Search by ${mode === "address" ? "Address" : mode === "mlsid" ? "MLS Listing ID" : "Parcel Number"}`}
              value={query}
              onChange={setQuery}
              placeholder={placeholders[mode]}
            />
          </div>
          <div style={{ marginBottom: "16px" }}>
            <Btn onClick={() => handleSearch()} disabled={loading || !query}>
              {loading ? "⏳ Searching..." : "Search"}
            </Btn>
          </div>
        </div>
        {error && <div style={{ color: "#dc2626", fontSize: "13px", background: "#fef2f2", borderRadius: "6px", padding: "10px", border: "1px solid #fecaca" }}>⚠️ {error}</div>}
      </Card>

      {/* Address results */}
      {results.length > 0 && (
        <Card style={{ marginBottom: "20px" }}>
          <div style={{ fontSize: "13px", fontWeight: "700", color: "#475569", marginBottom: "12px" }}>
            {results.length} result{results.length !== 1 ? "s" : ""} found — click to select
          </div>
          {results.map((r, i) => (
            <div key={i} onClick={() => setSelected(r)} style={{
              padding: "12px",
              border: `2px solid ${selected === r ? colors.gold : "#e2e8f0"}`,
              borderRadius: "8px",
              cursor: "pointer",
              marginBottom: "8px",
              background: selected === r ? "#fffbeb" : "#f8fafc",
              transition: "border-color 0.15s",
            }}>
              <div style={{ fontWeight: "700", fontSize: "14px", color: colors.navy }}>
                {r.StreetNumber} {r.StreetName} {r.StreetSuffix || ""}
              </div>
              <div style={{ fontSize: "12px", color: "#64748b", marginTop: "2px" }}>
                {r.City}, {r.StateOrProvince} {r.PostalCode} &nbsp;·&nbsp; <StatusPill status={r.StandardStatus} /> &nbsp;·&nbsp;
                <span style={{ color: colors.match, fontWeight: "600" }}>${Number(r.ListPrice).toLocaleString()}</span>
              </div>
            </div>
          ))}
        </Card>
      )}

      {/* Selected listing preview */}
      {selected && (
        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "16px" }}>
            <div>
              <div style={{ fontSize: "18px", fontWeight: "700", color: colors.navy, fontFamily: "Georgia, serif" }}>
                {selected.StreetNumber} {selected.StreetName} {selected.StreetSuffix || ""}
              </div>
              <div style={{ fontSize: "13px", color: "#64748b", marginTop: "2px" }}>
                {selected.City}, {selected.StateOrProvince} {selected.PostalCode}
                {selected.ListingId && <>&nbsp;·&nbsp; MLS# <strong>{selected.ListingId}</strong></>}
              </div>
              <div style={{ display: "flex", gap: "8px", marginTop: "8px", flexWrap: "wrap" }}>
                <StatusPill status={selected.StandardStatus || "Public Record"} />
                {selected.ListPrice && <Badge color={colors.match}>${Number(selected.ListPrice).toLocaleString()}</Badge>}
                {selected.BedroomsTotal && <Badge color={colors.navy}>{selected.BedroomsTotal} Bed</Badge>}
                {selected.BathroomsFull && <Badge color={colors.navy}>{selected.BathroomsFull} Bath</Badge>}
                {selected.LivingArea && <Badge color="#475569">{Number(selected.LivingArea).toLocaleString()} SF</Badge>}
                {selected.YearBuilt && <Badge color="#475569">Built {selected.YearBuilt}</Badge>}
              </div>
            </div>
            <div style={{ display: "flex", gap: "8px", flexShrink: 0 }}>
              {selected.ListingId && (
                <a href={`https://www.adamscameron.com/${selected.ListingId}`} target="_blank" rel="noopener noreferrer" style={{
                  background: "#f8fafc", color: "#475569", border: "1px solid #e2e8f0",
                  borderRadius: "8px", padding: "10px 16px", fontSize: "12px", fontWeight: "600",
                  textDecoration: "none", display: "inline-flex", alignItems: "center", gap: "6px",
                  fontFamily: "Georgia, serif",
                }}>🔗 View Listing</a>
              )}
              <Btn variant="gold" onClick={() => handleImport(selected)}>
                ⬇ MLS Input Sheet
              </Btn>
            </div>
          </div>

          <div style={{ borderRadius: "8px", overflow: "hidden", border: "1px solid #e2e8f0" }}>
            <div style={{ background: colors.navy, color: "white", padding: "8px 12px", fontSize: "11px", fontWeight: "700", textTransform: "uppercase", letterSpacing: "0.08em" }}>
              Bridge API — RESO Data Dictionary Fields
            </div>
            {[
              ["Property Type", selected.PropertySubType],
              ["Parcel Number", selected.ParcelNumber],
              ["Subdivision", selected.SubdivisionName],
              ["SqFt Heated", selected.LivingArea?.toLocaleString()],
              ["Lot Size", selected.LotSizeAcres ? `${selected.LotSizeAcres} acres` : selected.LotSizeDimensions],
              ["Garage", selected.GarageYN ? `Yes (${selected.GarageSpaces || 1} spaces)` : "No"],
              ["Pool", selected.PoolPrivateYN ? "Yes — " + (Array.isArray(selected.PoolFeatures) ? selected.PoolFeatures.join(", ") : selected.PoolFeatures || "") : "No"],
              ["HOA", selected.AssociationYN ? `Yes — $${selected.AssociationFee || "?"}/mo` : "No"],
              ["Tax Amount", selected.TaxAnnualAmount ? `$${Number(selected.TaxAnnualAmount).toLocaleString()}/yr (${selected.TaxYear})` : null],
              ["Zoning", selected.Zoning],
              ["Elementary", selected.ElementarySchool],
              ["List Agent", selected.ListAgentFullName],
              ["Office", selected.ListOfficeName],
              ["Days on Market", selected.DaysOnMarket],
            ].filter(([, v]) => v).map(([label, value]) => (
              <FieldRow key={label} label={label} value={String(value)} />
            ))}
          </div>

          {imported && (
            <div style={{ marginTop: "16px", background: "#f0fdf4", border: "1px solid #86efac", borderRadius: "8px", padding: "14px" }}>
              <div style={{ fontWeight: "700", color: "#15803d", fontSize: "14px" }}>✅ Data Imported Successfully</div>
              <div style={{ fontSize: "12px", color: "#166534", marginTop: "2px" }}>
                {Object.keys(imported).length} fields mapped from RESO standard → both MLS form formats. Switch to the <strong>MLS Input Sheets</strong> tab to review.
              </div>
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

// ─── TAB: Cross-System Report ──────────────────────────────────────────────
function CrossSystemReport({ settings, onImport, onViewForm }) {
  const [loading, setLoading] = useState(false);
  const [report, setReport] = useState(null);
  const [error, setError] = useState("");
  const [filter, setFilter] = useState("all"); // all | missing-dbar | missing-stellar | both
  const [fetchingRow, setFetchingRow] = useState(null); // addrKey of row being fetched

  const handleViewForm = async (row) => {
    if (!onImport || !onViewForm) return;
    setFetchingRow(row.addrKey);
    try {
      let fullRecord = null;

      // Fetch full record from whichever system has it — prefer DBAR when available
      // since the use case is usually "DBAR has it, need to enter into Stellar"
      if (row.daytonaId && row.daytonaId !== "—") {
        try {
          fullRecord = await sparkAPI.searchByMlsId(
            settings.sparkToken, row.daytonaId,
            settings.proxyUrl, settings.proxySecret, settings.sparkFeedId
          );
        } catch(e) {
          console.warn("Spark full-record fetch failed, falling back to Bridge:", e.message);
        }
      }
      if (!fullRecord && row.stellarId && row.stellarId !== "—") {
        try {
          const results = await bridgeAPI.searchByMlsId(
            settings.bridgeToken, settings.stellarDsKey || "stellar",
            row.stellarId, settings.proxyUrl, settings.proxySecret
          );
          fullRecord = Array.isArray(results) ? results[0] : results;
        } catch(e) {
          console.warn("Bridge full-record fetch failed:", e.message);
        }
      }

      // Fall back to the summary data already in the row if both fetches fail
      const source = fullRecord || row.data;
      const mapped = resoToForm(source);

      // Set system-specific IDs
      if (row.stellarId && row.stellarId !== "—") mapped.stellarListingId = row.stellarId;
      if (row.daytonaId && row.daytonaId !== "—") mapped.dbarListingId = row.daytonaId;

      // Tell FormsOutput which tab to show: 
      // DBAR-only → open Stellar (that's where the agent needs to enter it)
      // Stellar-only → open DBAR
      // Both → open Stellar by default
      mapped._defaultFormTab = (!row.inStellar && row.inDaytona) ? "stellar"
        : (!row.inDaytona && row.inStellar) ? "daytona"
        : "stellar";

      onImport(mapped);
      onViewForm();
    } finally {
      setFetchingRow(null);
    }
  };

  const runReport = async () => {
    setLoading(true);
    setError("");

    try {
      let stellar, daytona;

      const isLive = true;  // the server holds the Stellar and Daytona tokens

      if (!isLive) {
        await new Promise(r => setTimeout(r, 1200));
        stellar = MOCK_STELLAR_LISTINGS;
        daytona = MOCK_DBAR_LISTINGS;
      } else {
        // Stellar: query all 6 Adams Cameron office keys in parallel, deduplicate by ListingId
        // Run Spark and Stellar sequentially so failures are individually identifiable
        let daytonaResults;
        const sparkBase = Auth.API + '/spark';
        try {
          daytonaResults = await sparkAPI.getOfficeListings(settings.sparkToken, settings.officeName, settings.proxyUrl, settings.proxySecret);
        } catch(e) {
          throw new Error('DBAR Spark failed: ' + e.message + ' | URL: ' + sparkBase + '/Property');
        }

        let stellarResults;
        try {
          stellarResults = await Promise.all(
            STELLAR_OFFICE_KEYS.map(key =>
              bridgeAPI.getOfficeListings(
                settings.bridgeToken, settings.stellarDsKey || "stellar",
                "KEY:" + key, settings.proxyUrl, settings.proxySecret
              ).catch(() => [])
            )
          );
        } catch(e) {
          throw new Error('Stellar Bridge failed: ' + e.message);
        }
        const stellarMap = new Map();
        stellarResults.flat().forEach(l => { if (l.ListingId) stellarMap.set(l.ListingId, l); });
        stellar = Array.from(stellarMap.values());
        daytona = daytonaResults;
        if (stellar.length === 0) throw new Error('Stellar returned 0 listings — check office keys or Bridge token.');
      }

      // ── Match by address since the two systems have no shared identifiers ──
      // Primary key: StreetNumber|StreetName (normalized)
      // Secondary: ParcelNumber (when both systems return it)

      const stellarByAddr = new Map(stellar.map(l => [addressKey(l), l]));
      const normalizeParcel = p => p.trim().replace(/-/g, "").toUpperCase();
      const stellarByParcel = new Map(
        stellar.filter(l => l.ParcelNumber).map(l => [normalizeParcel(l.ParcelNumber), l])
      );
      const daytonaByAddr = new Map(daytona.map(l => [addressKey(l), l]));
      const daytonaByParcel = new Map(
        daytona.filter(l => l.ParcelNumber).map(l => [normalizeParcel(l.ParcelNumber), l])
      );

      // ── DIAGNOSTIC: log raw fields for known problem listings ──
      const WATCH_IDS = ["V4947463", "1223212"];
      const watchStellar = stellar.find(l => WATCH_IDS.includes(l.ListingId));
      const watchDaytona = daytona.find(l => WATCH_IDS.includes(l.ListingId));
      if (watchStellar) console.log("🔵 STELLAR raw:", {
        ListingId: watchStellar.ListingId,
        StreetNumber: watchStellar.StreetNumber,
        StreetName: watchStellar.StreetName,
        StreetSuffix: watchStellar.StreetSuffix,
        City: watchStellar.City,
        ParcelNumber: watchStellar.ParcelNumber,
        addressKey: addressKey(watchStellar),
      });
      if (watchDaytona) console.log("🟠 DBAR raw:", {
        ListingId: watchDaytona.ListingId,
        StreetNumber: watchDaytona.StreetNumber,
        StreetName: watchDaytona.StreetName,
        StreetSuffix: watchDaytona.StreetSuffix,
        City: watchDaytona.City,
        ParcelNumber: watchDaytona.ParcelNumber,
        addressKey: addressKey(watchDaytona),
      });

      // Collect all unique addresses from both systems
      const allAddrs = new Set([...stellarByAddr.keys(), ...daytonaByAddr.keys()]);

      const rowsRaw = Array.from(allAddrs).map(addr => {
        const stellarListing = stellarByAddr.get(addr);
        let daytonaListing = daytonaByAddr.get(addr);

        // If no address match, try parcel number as fallback (Stellar→DBAR direction)
        if (!daytonaListing && stellarListing?.ParcelNumber) {
          daytonaListing = daytonaByParcel.get(normalizeParcel(stellarListing.ParcelNumber));
        }

        return {
          addrKey: addr,
          inStellar: !!stellarListing,
          inDaytona: !!daytonaListing,
          stellarId: stellarListing?.ListingId || "—",
          daytonaId: daytonaListing?.ListingId || "—",
          stellarData: stellarListing || null,
          daytonaData: daytonaListing || null,
          data: stellarListing || daytonaListing,
        };
      });

      // Deduplicate: when two address keys in allAddrs refer to the same DBAR listing
      // (e.g. one system bakes the street suffix into StreetName, the other uses StreetSuffix),
      // the first pass creates both an inBoth row AND a false DBAR-only row.
      // Keep only the best row per daytonaId — preferring inBoth over inDaytona-only.
      const bestByDaytonaId = new Map();
      for (const row of rowsRaw) {
        if (row.daytonaId === "—") continue;
        const existing = bestByDaytonaId.get(row.daytonaId);
        if (!existing || (row.inStellar && !existing.inStellar)) {
          bestByDaytonaId.set(row.daytonaId, row);
        }
      }
      // Build final rows: all rows with no daytonaId + deduplicated daytona rows
      const rows = rowsRaw.filter(r => r.daytonaId === "—" || bestByDaytonaId.get(r.daytonaId) === r);

      // Add any DBAR-only listings not already captured
      for (const [addr, l] of daytonaByAddr.entries()) {
        if (!stellarByAddr.has(addr)) {
          // Check if already matched via parcel in the first pass
          const alreadyCaptured = rows.some(r => r.daytonaId === l.ListingId);
          if (!alreadyCaptured) {
            // Try parcel match against Stellar before declaring DBAR-only
            const stellarMatch = l.ParcelNumber ? stellarByParcel.get(normalizeParcel(l.ParcelNumber)) : null;
            if (stellarMatch) {
              const existingRow = rows.find(r => r.stellarId === stellarMatch.ListingId);
              if (existingRow) {
                existingRow.inDaytona = true;
                existingRow.daytonaId = l.ListingId;
                existingRow.daytonaData = l;
              } else {
                rows.push({ addrKey: addr, inStellar: true, inDaytona: true, stellarId: stellarMatch.ListingId, daytonaId: l.ListingId, stellarData: stellarMatch, daytonaData: l, data: stellarMatch });
              }
            } else {
              rows.push({ addrKey: addr, inStellar: false, inDaytona: true, stellarId: "—", daytonaId: l.ListingId, stellarData: null, daytonaData: l, data: l });
            }
          }
        }
      }

      const inBoth = rows.filter(r => r.inStellar && r.inDaytona).length;
      const onlyStellar = rows.filter(r => r.inStellar && !r.inDaytona).length;
      const onlyDaytona = rows.filter(r => !r.inStellar && r.inDaytona).length;

      // Flag status and price mismatches for listings in both systems
      const normalizeStatus = s => (s || "").trim().toLowerCase().replace(/[^a-z]/g, "");
      for (const row of rows) {
        if (!row.inStellar || !row.inDaytona) continue;
        const sStatus = normalizeStatus(row.stellarData?.StandardStatus);
        const dStatus = normalizeStatus(row.daytonaData?.StandardStatus);
        const sPrice = Number(row.stellarData?.ListPrice || 0);
        const dPrice = Number(row.daytonaData?.ListPrice || 0);
        row.statusMismatch = sStatus && dStatus && sStatus !== dStatus;
        // Flag price diff > $500 to ignore trivial rounding differences
        row.priceMismatch = sPrice > 0 && dPrice > 0 && Math.abs(sPrice - dPrice) > 500;
      }
      const mismatches = rows.filter(r => r.statusMismatch || r.priceMismatch).length;

      setReport({ rows, stellar, daytona, stats: { total: rows.length, inBoth, onlyStellar, onlyDaytona, mismatches }, isLive, generatedAt: new Date() });
    } catch (e) {
      setError(`Failed: ${e.message}`);
    }
    setLoading(false);
  };

  const filteredRows = report?.rows.filter(r => {
    if (filter === "missing-dbar") return r.inStellar && !r.inDaytona;
    if (filter === "missing-stellar") return !r.inStellar && r.inDaytona;
    if (filter === "both") return r.inStellar && r.inDaytona;
    if (filter === "mismatches") return r.statusMismatch || r.priceMismatch;
    return true;
  }) || [];

  const [sortCol, setSortCol] = useState("address");
  const [sortDir, setSortDir] = useState("asc");

  const handleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortCol(col); setSortDir("asc"); }
  };

  const sortedRows = [...filteredRows].sort((a, b) => {
    const dir = sortDir === "asc" ? 1 : -1;
    const ad = a.data, bd = b.data;
    if (sortCol === "stellar")  return dir * a.stellarId.localeCompare(b.stellarId);
    if (sortCol === "daytona")  return dir * a.daytonaId.localeCompare(b.daytonaId);
    if (sortCol === "status")   return dir * (ad.StandardStatus || "").localeCompare(bd.StandardStatus || "");
    if (sortCol === "address")  return dir * (`${ad.StreetName} ${ad.StreetNumber}`).localeCompare(`${bd.StreetName} ${bd.StreetNumber}`);
    if (sortCol === "price")    return dir * (Number(ad.ListPrice || 0) - Number(bd.ListPrice || 0));
    if (sortCol === "agent")    return dir * (ad.ListAgentFullName || "").localeCompare(bd.ListAgentFullName || "");
    return 0;
  });

  const SortHeader = ({ col, children, style = {} }) => {
    const active = sortCol === col;
    return (
      <div onClick={() => handleSort(col)} style={{ cursor: "pointer", userSelect: "none", display: "flex", alignItems: "center", gap: "4px", ...style }}>
        <span>{children}</span>
        <span style={{ opacity: active ? 1 : 0.35, fontSize: "9px" }}>{active && sortDir === "desc" ? "▼" : "▲"}</span>
      </div>
    );
  };

  return (
    <div>
      <SectionTitle icon="📊" children="Cross-System Report" sub="Identify listings that exist in one MLS but are missing from the other — catch gaps before they affect marketing or reporting accuracy" />

      <Card style={{ marginBottom: "20px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: "13px", color: "#475569" }}>
            {loading
              ? <span>⏳ Refreshing… <span style={{ color: "#94a3b8" }}>(previous results still shown below)</span></span>
              : report
                ? <span>Report generated · {report.stats.total} total listings · <span style={{ color: "#94a3b8" }}>Last refreshed {report.generatedAt.toLocaleTimeString()}</span></span>
                : "Click Refresh to load the report."}
          </div>
          <Btn onClick={runReport} disabled={loading}>
            {loading ? "⏳ Running…" : "🔄 Refresh"}
          </Btn>
        </div>
        {error && <div style={{ color: "#dc2626", fontSize: "13px", background: "#fef2f2", borderRadius: "6px", padding: "10px", border: "1px solid #fecaca", marginTop: "8px" }}>⚠️ {error}</div>}
      </Card>

      {report && (
        <>
          {/* Stats */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: "12px", marginBottom: "20px" }}>
            {[
              { label: "Total Listings", value: report.stats.total, color: colors.navy, sub: "across both systems" },
              { label: "In Both Systems", value: report.stats.inBoth, color: colors.match, sub: "fully covered ✓" },
              { label: "Stellar Only", value: report.stats.onlyStellar, color: colors.stellar, sub: "missing from DBAR ⚠" },
              { label: "DBAR Only", value: report.stats.onlyDaytona, color: colors.daytona, sub: "missing from Stellar ⚠" },
              { label: "Mismatches", value: report.stats.mismatches, color: "#d97706", sub: "status or price differs ⚠" },
            ].map(s => (
              <div key={s.label} style={{
                background: "white",
                borderRadius: "12px",
                border: `2px solid ${s.color}30`,
                padding: "16px",
                textAlign: "center",
              }}>
                <div style={{ fontSize: "32px", fontWeight: "700", color: s.color, fontFamily: "Georgia, serif" }}>{s.value}</div>
                <div style={{ fontSize: "12px", fontWeight: "700", color: "#475569", marginTop: "4px" }}>{s.label}</div>
                <div style={{ fontSize: "11px", color: "#94a3b8", marginTop: "2px" }}>{s.sub}</div>
              </div>
            ))}
          </div>

          {/* Alert if gaps */}
          {(report.stats.onlyStellar > 0 || report.stats.onlyDaytona > 0 || report.stats.mismatches > 0) && (
            <div style={{ background: "#fff7ed", border: "1px solid #fed7aa", borderRadius: "10px", padding: "14px 18px", marginBottom: "20px" }}>
              <div style={{ fontWeight: "700", color: "#c2410c", fontSize: "14px" }}>⚠️ Issues Detected</div>
              <div style={{ fontSize: "13px", color: "#9a3412", marginTop: "4px" }}>
                {report.stats.onlyStellar > 0 && <div>{report.stats.onlyStellar} listing{report.stats.onlyStellar !== 1 ? "s" : ""} in <strong>Stellar MLS</strong> are not in <strong>Daytona DBAR</strong>.</div>}
                {report.stats.onlyDaytona > 0 && <div>{report.stats.onlyDaytona} listing{report.stats.onlyDaytona !== 1 ? "s" : ""} in <strong>Daytona DBAR</strong> are not in <strong>Stellar MLS</strong>.</div>}
                {report.stats.mismatches > 0 && <div>{report.stats.mismatches} listing{report.stats.mismatches !== 1 ? "s" : ""} have a <strong>status or price mismatch</strong> between systems.</div>}
              </div>
            </div>
          )}

          {/* Filter tabs */}
          <div style={{ display: "flex", gap: "8px", marginBottom: "14px" }}>
            {[
              { id: "all", label: "All Listings" },
              { id: "both", label: `✓ In Both (${report.stats.inBoth})`, color: colors.match },
              { id: "missing-dbar", label: `⚠ Missing from DBAR (${report.stats.onlyStellar})`, color: colors.stellar },
              { id: "missing-stellar", label: `⚠ Missing from Stellar (${report.stats.onlyDaytona})`, color: colors.daytona },
              { id: "mismatches", label: `⚡ Mismatches (${report.stats.mismatches})`, color: "#d97706" },
            ].map(f => (
              <button key={f.id} onClick={() => setFilter(f.id)} style={{
                background: filter === f.id ? (f.color || colors.navy) : "white",
                color: filter === f.id ? "white" : (f.color || "#475569"),
                border: `1px solid ${filter === f.id ? (f.color || colors.navy) : "#e2e8f0"}`,
                borderRadius: "20px",
                padding: "5px 14px",
                fontSize: "12px",
                fontWeight: "600",
                cursor: "pointer",
                fontFamily: "Georgia, serif",
              }}>{f.label}</button>
            ))}
          </div>

          {/* Listing table */}
          <Card>
            <div style={{ borderRadius: "8px", overflow: "hidden", border: "1px solid #e2e8f0" }}>
              {/* Header — 9 columns: Stellar# | DBAR# | Status | Address | Price | Agent | ⭐ | 🌊 | button */}
              <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1.2fr 1.2fr 2.2fr 1.1fr 1.4fr 0.6fr 0.6fr auto", background: colors.navy, color: "white", padding: "10px 12px", fontSize: "11px", fontWeight: "700", textTransform: "uppercase", letterSpacing: "0.06em", gap: "8px", alignItems: "center" }}>
                <SortHeader col="stellar" style={{ color: "#a78bfa" }}>Stellar MLS#</SortHeader>
                <SortHeader col="daytona" style={{ color: "#7dd3fc" }}>DBAR MLS#</SortHeader>
                <SortHeader col="status">Status</SortHeader>
                <SortHeader col="address">Address</SortHeader>
                <SortHeader col="price">List Price</SortHeader>
                <SortHeader col="agent">Agent</SortHeader>
                <div style={{ color: "#a78bfa", textAlign: "center" }}>⭐</div>
                <div style={{ color: "#7dd3fc", textAlign: "center" }}>🌊</div>
                <div></div>
              </div>
              {sortedRows.map((row, i) => {
                const d = row.data;
                const addr = `${d.StreetNumber} ${d.StreetName}${d.StreetSuffix ? " " + d.StreetSuffix : ""}${d.UnitNumber ? " Unit " + d.UnitNumber : ""}, ${d.City}`;
                const hasMismatch = row.statusMismatch || row.priceMismatch;
                return (
                  <div key={row.addrKey || i} style={{
                    display: "grid",
                    gridTemplateColumns: "1.2fr 1.2fr 1.2fr 2.2fr 1.1fr 1.4fr 0.6fr 0.6fr auto",
                    padding: "8px 12px",
                    borderBottom: "1px solid #f1f5f9",
                    background: hasMismatch ? "#fffbeb" : i % 2 === 0 ? "white" : "#f8fafc",
                    borderLeft: hasMismatch ? "3px solid #d97706" : "3px solid transparent",
                    gap: "8px",
                    alignItems: "center",
                    fontSize: "12px",
                  }}>
                    <div style={{ fontWeight: "600", color: colors.stellar, fontFamily: "Georgia, serif" }}>{row.stellarId}</div>
                    <div style={{ fontWeight: "600", color: colors.daytona, fontFamily: "Georgia, serif" }}>{row.daytonaId}</div>
                    <div>
                      {row.statusMismatch ? (
                        <div>
                          <div style={{ fontSize: "10px", color: colors.stellar, fontWeight: "700" }}>⭐ {row.stellarData?.StandardStatus}</div>
                          <div style={{ fontSize: "10px", color: colors.daytona, fontWeight: "700" }}>🌊 {row.daytonaData?.StandardStatus}</div>
                        </div>
                      ) : (
                        <StatusPill status={d.StandardStatus} />
                      )}
                    </div>
                    <div style={{ color: "#374151" }}>{addr}</div>
                    <div>
                      {row.priceMismatch ? (
                        <div>
                          <div style={{ fontSize: "10px", color: colors.stellar, fontWeight: "700" }}>⭐ ${Number(row.stellarData?.ListPrice || 0).toLocaleString()}</div>
                          <div style={{ fontSize: "10px", color: colors.daytona, fontWeight: "700" }}>🌊 ${Number(row.daytonaData?.ListPrice || 0).toLocaleString()}</div>
                        </div>
                      ) : (
                        <div style={{ fontWeight: "600", color: colors.match }}>${Number(d.ListPrice || 0).toLocaleString()}</div>
                      )}
                    </div>
                    <div style={{ fontSize: "11px", color: "#374151" }}>
                      {d.ListAgentFullName || <span style={{ color: "#cbd5e1", fontStyle: "italic" }}>—</span>}
                    </div>
                    <div style={{ fontSize: "18px", textAlign: "center" }}>{row.inStellar ? "✅" : "❌"}</div>
                    <div style={{ fontSize: "18px", textAlign: "center" }}>{row.inDaytona ? "✅" : "❌"}</div>
                    <button onClick={() => handleViewForm(row)} disabled={fetchingRow === row.addrKey} style={{
                      background: fetchingRow === row.addrKey ? "#e2e8f0" : colors.gold,
                      color: fetchingRow === row.addrKey ? "#94a3b8" : colors.navy,
                      border: "none", borderRadius: "6px",
                      padding: "5px 10px", fontSize: "11px", fontWeight: "700", cursor: fetchingRow === row.addrKey ? "default" : "pointer",
                      fontFamily: "Georgia, serif", whiteSpace: "nowrap",
                    }}>{fetchingRow === row.addrKey ? "⏳ Loading…" : "📄 View Form"}</button>
                  </div>
                );
              })}
              {sortedRows.length === 0 && (
                <div style={{ padding: "24px", textAlign: "center", color: "#94a3b8", fontSize: "13px" }}>No listings match this filter.</div>
              )}
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

function AdminRecipientsCard({ settings }) {
  const PROXY  = Auth.API;
  const headers = Auth.headers();

  const [recipients, setRecipients] = React.useState([]);
  const [loading, setLoading]       = React.useState(false);
  const [error, setError]           = React.useState('');
  const [newEmail, setNewEmail]     = React.useState('');
  const [newName, setNewName]       = React.useState('');
  const [newSummary, setNewSummary] = React.useState(true);
  const [newAlerts, setNewAlerts]   = React.useState(true);
  const [adding, setAdding]         = React.useState(false);

  const load = async () => {
    if (!PROXY) return;
    setLoading(true);
    try {
      const r = await fetch(`${PROXY}/admin/recipients`, { headers });
      if (!r.ok) throw new Error(`Server ${r.status}`);
      const d = await r.json();
      setRecipients((d.recipients || []).filter(r => r.active));
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  React.useEffect(() => { load(); }, []);

  const addRecipient = async () => {
    if (!newEmail.trim()) return;
    setAdding(true); setError('');
    try {
      const r = await fetch(`${PROXY}/admin/recipients`, {
        method: 'POST', headers,
        body: JSON.stringify({ name: newName.trim(), email: newEmail.trim(), receives_daily_summary: newSummary, receives_gap_alerts: newAlerts }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `Server ${r.status}`);
      setNewEmail(''); setNewName('');
      await load();
    } catch(e) { setError(e.message); }
    finally { setAdding(false); }
  };

  const removeRecipient = async (id) => {
    try {
      const r = await fetch(`${PROXY}/admin/recipients/${id}`, {
        method: 'DELETE',
        headers,
      });
      if (!r.ok) throw new Error((await r.json()).error || `Server ${r.status}`);
      setRecipients(prev => prev.filter(rec => rec.id !== id));
    } catch(e) { setError(e.message); }
  };

  const flagPill = (label, active) => (
    <span style={{ background: active ? '#dcfce7' : '#f1f5f9', color: active ? '#15803d' : '#94a3b8', border: `1px solid ${active ? '#86efac' : '#e2e8f0'}`, borderRadius: 10, padding: '1px 8px', fontSize: 11, fontWeight: 600 }}>
      {label}
    </span>
  );

  return (
    <Card style={{ marginTop: '20px' }}>
      <div style={{ fontSize: '14px', fontWeight: '700', color: '#0369a1', marginBottom: '4px', fontFamily: 'Georgia, serif' }}>
        📬 Office Admin Notification Recipients
      </div>
      <div style={{ fontSize: '11px', color: '#64748b', marginBottom: '16px' }}>
        These recipients receive scheduled reports regardless of individual agent opt-ins.
        Use this for office managers, coordinators, or the broker.
      </div>

      {error && <div style={{ background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: 7, padding: '8px 12px', color: '#b91c1c', fontSize: 12, marginBottom: 12 }}>⚠️ {error}</div>}

      {/* Existing recipients */}
      {loading ? (
        <div style={{ color: '#94a3b8', fontSize: 13, padding: '8px 0' }}>Loading…</div>
      ) : recipients.length === 0 ? (
        <div style={{ color: '#94a3b8', fontSize: 13, padding: '8px 0', fontStyle: 'italic' }}>No admin recipients yet. Add one below.</div>
      ) : (
        <div style={{ marginBottom: 16 }}>
          {recipients.map(r => (
            <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0', borderBottom: '1px solid #f1f5f9' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 13, color: colors.navy }}>{r.name || r.email}</div>
                {r.name && <div style={{ fontSize: 12, color: '#64748b' }}>{r.email}</div>}
                <div style={{ display: 'flex', gap: 5, marginTop: 4, flexWrap: 'wrap' }}>
                  {flagPill('Daily Summary', r.receives_daily_summary)}
                  {flagPill('Gap Alerts', r.receives_gap_alerts)}
                </div>
              </div>
              <button onClick={() => { if (window.confirm(`Remove ${r.name || r.email} from admin recipients?`)) removeRecipient(r.id); }}
                style={{ background: 'none', border: '1px solid #fca5a5', color: '#dc2626', borderRadius: 6, padding: '4px 10px', fontSize: 12, cursor: 'pointer' }}>Remove</button>
            </div>
          ))}
        </div>
      )}

      {/* Add new recipient */}
      <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: 8, padding: '14px', marginTop: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: colors.navy, marginBottom: 10 }}>➕ Add Recipient</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
          <div>
            <label style={{ fontSize: 11, fontWeight: 600, color: '#374151', display: 'block', marginBottom: 3 }}>Name</label>
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Jane Smith"
              style={{ width: '100%', padding: '7px 10px', border: '1px solid #d1d5db', borderRadius: 6, fontSize: 13 }} />
          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 600, color: '#374151', display: 'block', marginBottom: 3 }}>Email *</label>
            <input value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="jane@adamscameron.com" type="email"
              style={{ width: '100%', padding: '7px 10px', border: '1px solid #d1d5db', borderRadius: 6, fontSize: 13 }} />
          </div>
        </div>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginBottom: 10, flexWrap: 'wrap' }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, cursor: 'pointer' }}>
            <input type="checkbox" checked={newSummary} onChange={e => setNewSummary(e.target.checked)} /> Daily Summary
          </label>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, cursor: 'pointer' }}>
            <input type="checkbox" checked={newAlerts} onChange={e => setNewAlerts(e.target.checked)} /> Gap Alerts
          </label>
        </div>
        <button onClick={addRecipient} disabled={adding || !newEmail.trim()}
          style={{ background: adding || !newEmail.trim() ? '#d1d5db' : colors.navy, color: 'white', border: 'none', borderRadius: 6, padding: '8px 18px', fontSize: 13, fontWeight: 700, cursor: adding || !newEmail.trim() ? 'default' : 'pointer', fontFamily: 'Georgia, serif' }}>
          {adding ? 'Adding…' : 'Add Recipient'}
        </button>
      </div>
    </Card>
  );
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => Array.from({ length: n + 1 }, (_, j) => j === 0 ? i : 0));
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function fuzzyNameScore(a, b) {
  if (!a || !b) return 0;
  const norm = s => s.toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\b(team|llc|lc|pa|inc|corp|realty|group|associates|associate|real estate|realtor|realtors|properties|property)\b/g, '')
    .replace(/\s+/g, ' ').trim()
    .split(' ').sort().join(' ');
  const na = norm(a), nb = norm(b);
  if (!na || !nb) return 0;
  const maxLen = Math.max(na.length, nb.length);
  return Math.round((1 - levenshtein(na, nb) / maxLen) * 100);
}

function AgentMatchingTab({ settings, user }) {
  const PROXY = Auth.API;
  const headers = Auth.headers();

  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [data, setData] = React.useState(null);          // { stellar, dbar }
  const [selected, setSelected] = React.useState(null);  // selected Stellar membership
  const [search, setSearch] = React.useState('');
  const [confirming, setConfirming] = React.useState(null);
  const [successMsg, setSuccessMsg] = React.useState('');
  const [matchedIds, setMatchedIds] = React.useState(new Set()); // stellar membership IDs confirmed this session
  const [running, setRunning]       = React.useState(false);
  const [runStatus, setRunStatus]   = React.useState('');
  const [matched, setMatched]       = React.useState([]);   // confirmed matched agents
  const [matchedLoading, setMatchedLoading] = React.useState(false);
  const [copyMsg, setCopyMsg]       = React.useState('');
  const [unmatchConfirm, setUnmatchConfirm] = React.useState(null);
  const [unmatchingId, setUnmatchingId] = React.useState(null);

  const runNow = async () => {
    setRunning(true); setRunStatus(''); setError('');
    try {
      const r = await fetch(`${PROXY}/admin/run-crosscheck`, { method: 'POST', headers });
      if (!r.ok) throw new Error(`Server ${r.status}`);
      setRunStatus('✅ Crosscheck started — emails will arrive within a few minutes.');
    } catch(e) { setError(e.message); }
    finally { setRunning(false); }
  };

  const loadMatched = async () => {
    setMatchedLoading(true);
    try {
      const r = await fetch(`${PROXY}/admin/agent-sync/matched`, { headers });
      if (!r.ok) throw new Error(`Server ${r.status}`);
      const d = await r.json();
      setMatched(d.agents || []);
    } catch(e) { console.warn('Could not load matched agents:', e.message); }
    finally { setMatchedLoading(false); }
  };

  const copyPrefsLink = (token, agentId) => {
    const url = `https://johnadams.org/prefs.html?token=${token}`;
    navigator.clipboard.writeText(url).then(() => {
      setCopyMsg(agentId);
      setTimeout(() => setCopyMsg(''), 2000);
    });
  };

  const unmatchAgent = async (agentId) => {
    setUnmatchingId(agentId);
    try {
      const r = await fetch(`${PROXY}/admin/agent-sync/unmatch`, {
        method: 'POST', headers,
        body: JSON.stringify({ agent_id: agentId, performed_by: user?.email || 'admin' }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `Server ${r.status}`);
      setMatched(prev => prev.filter(a => a.agent_id !== agentId));
      setUnmatchConfirm(null);
    } catch(e) { setError(e.message); }
    finally { setUnmatchingId(null); }
  };

  const load = async () => {
    setLoading(true); setError(''); setSuccessMsg('');
    try {
      const r = await fetch(`${PROXY}/admin/agent-sync/unmatched`, { headers });
      if (!r.ok) throw new Error(`Server ${r.status}`);
      setData(await r.json());
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  React.useEffect(() => { load(); loadMatched(); }, []);

  const stellarList = (data?.stellar?.members || []).filter(m => !matchedIds.has(m.id));
  const dbarAll = data?.dbar?.members || [];

  // Score DBAR candidates against selected Stellar agent
  const candidates = React.useMemo(() => {
    if (!selected) return [];
    return dbarAll
      .map(d => ({
        ...d,
        nameScore:  fuzzyNameScore(selected.mls_name, d.mls_name),
        emailScore: selected.mls_email && d.mls_email
                    ? (selected.mls_email.toLowerCase() === d.mls_email.toLowerCase() ? 100 : 0)
                    : 0,
      }))
      .map(d => ({ ...d, score: Math.round(d.emailScore * 0.6 + d.nameScore * 0.4) }))
      .filter(d => {
        if (search.trim()) {
          const q = search.toLowerCase();
          return (d.mls_name || '').toLowerCase().includes(q) || (d.mls_email || '').toLowerCase().includes(q);
        }
        return d.score >= 30;
      })
      .sort((a, b) => b.score - a.score)
      .slice(0, 30);
  }, [selected, dbarAll, search]);

  const confirmMatch = async (dbarMember) => {
    setConfirming(dbarMember.id);
    try {
      const r = await fetch(`${PROXY}/admin/agent-sync/manual-match`, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          stellar_membership_id: selected.id,
          dbar_membership_id:    dbarMember.id,
          performed_by:          user?.email || 'admin',
        }),
      });
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || `Server ${r.status}`); }
      const result = await r.json();
      setMatchedIds(prev => new Set([...prev, selected.id]));
      setSuccessMsg(`✓ Matched: ${result.stellar_name} ↔ ${result.dbar_name}`);
      setSelected(null);
    } catch(e) { setError(e.message); }
    finally { setConfirming(null); }

  const scoreColor = s => s >= 80 ? '#16a34a' : s >= 50 ? '#d97706' : '#6b7280';

    <span style={{ background: color + '22', color, border: `1px solid ${color}55`, borderRadius: 12, padding: '1px 8px', fontSize: 11, fontWeight: 700 }}>{label}</span>
  );

  return (
    <div>
      <div style={{ marginBottom: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: colors.navy, fontFamily: 'Georgia, serif' }}>🔗 Agent Matching</div>

        <button onClick={runNow} disabled={running} style={{ background: running ? '#d1d5db' : '#16a34a', color: 'white', border: 'none', borderRadius: 8, padding: '8px 18px', fontSize: 13, fontWeight: 700, cursor: running ? 'default' : 'pointer', fontFamily: 'Georgia, serif' }}>
          {running ? '⟳ Running…' : '▶ Run Crosscheck Now'}

        <a href={`${PROXY}/admin/agents/onboarding-csv`}

                a.click(); URL.revokeObjectURL(url);

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 600, fontSize: 14, color: colors.navy }}>{d.mls_name}</div>
                          {d.mls_email && <div style={{ fontSize: 12, color: '#64748b' }}>{d.mls_email}</div>}
                          {d.mls_office_name && <div style={{ fontSize: 11, color: '#64748b', marginTop: 2 }}>{d.mls_office_name}</div>}
                          <div style={{ marginTop: 6, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                            {pill(`${d.score}% match`, scoreColor(d.score))}
                            {d.emailScore === 100 && pill('Email ✓', '#16a34a')}
                          </div>
                        </div>
                        <button
                          onClick={() => confirmMatch(d)}
                          disabled={confirming === d.id}
                          style={{ background: confirming === d.id ? '#d1d5db' : '#16a34a', color: 'white', border: 'none', borderRadius: 6, padding: '6px 14px', fontSize: 12, fontWeight: 700, cursor: confirming === d.id ? 'default' : 'pointer', whiteSpace: 'nowrap' }}>
                          {confirming === d.id ? '…' : '✓ Confirm'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div style={{ padding: 32, textAlign: 'center', color: '#64748b', fontSize: 14 }}>
                ← Select a Stellar agent to see DBAR matches
              </div>
            )}
          </div>
        </div>
      )}

      {/* Matched Agents Panel */}
      <div style={{ marginTop: 28 }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: colors.navy, fontFamily: 'Georgia, serif', marginBottom: 12 }}>
          ✅ Confirmed Matched Agents {matched.length > 0 && `(${matched.length})`}
        </div>

        {matchedLoading ? (
          <div style={{ color: '#94a3b8', fontSize: 13 }}>Loading…</div>
        ) : matched.length === 0 ? (
          <div style={{ color: '#94a3b8', fontSize: 13, fontStyle: 'italic' }}>No confirmed matches yet.</div>
        ) : (
          <div style={{ background: 'white', borderRadius: 12, border: '1px solid #e2e8f0', overflow: 'hidden' }}>
            {/* Header row */}
            <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1.4fr 1.4fr 1.4fr auto', gap: 0, background: '#f8fafc', borderBottom: '1px solid #e2e8f0', padding: '8px 14px' }}>
              {['Canonical Name', 'Stellar Name', 'DBAR Name', 'Notification Email', ''].map(h => (
                <div key={h} style={{ fontSize: 11, fontWeight: 700, color: '#64748b' }}>{h}</div>
              ))}
            </div>

            {matched.map(a => {
              const token = btoa(`${a.agent_id}:mls-bridge`).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
              const isCopied = copyMsg === a.agent_id;
              const isUnmatchPending = unmatchConfirm === a.agent_id;

              return (
                <div key={a.agent_id} style={{ display: 'grid', gridTemplateColumns: '1.6fr 1.4fr 1.4fr 1.4fr auto', gap: 0, padding: '10px 14px', borderBottom: '1px solid #f1f5f9', alignItems: 'center' }}>
                  {/* Canonical name */}
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13, color: colors.navy }}>{a.canonical_name}</div>
                    <span style={{ fontSize: 10, background: a.match_confidence === 'manual' ? '#eff6ff' : '#f0fdf4', color: a.match_confidence === 'manual' ? '#1d4ed8' : '#15803d', border: `1px solid ${a.match_confidence === 'manual' ? '#bfdbfe' : '#86efac'}`, borderRadius: 8, padding: '1px 6px', fontWeight: 600 }}>
                      {a.match_confidence === 'manual' ? 'manual' : 'auto'}
                    </span>
                  </div>

                  {/* Stellar */}
                  <div>
                    <div style={{ fontSize: 13, color: '#1e293b' }}>{a.stellar_name}</div>
                    <div style={{ fontSize: 11, color: '#94a3b8' }}>{a.stellar_email || '—'}</div>
                  </div>

                  {/* DBAR */}
                  <div>
                    <div style={{ fontSize: 13, color: '#1e293b' }}>{a.dbar_name}</div>
                    <div style={{ fontSize: 11, color: '#94a3b8' }}>{a.dbar_email || '—'}</div>
                  </div>

                  {/* Notification email + prefs link */}
                  <div>
                    <div style={{ fontSize: 12, color: '#1e293b' }}>{a.notify_email || a.canonical_email || '—'}</div>
                    <button onClick={() => copyPrefsLink(token, a.agent_id)}
                      style={{ background: 'none', border: 'none', color: isCopied ? '#16a34a' : '#0369a1', fontSize: 11, cursor: 'pointer', padding: 0, fontWeight: 600 }}>
                      {isCopied ? '✓ Copied!' : '🔗 Copy prefs link'}
                    </button>
                  </div>

                  {/* Unmatch */}
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    {!isUnmatchPending ? (
                      <button onClick={() => setUnmatchConfirm(a.agent_id)}
                        style={{ background: 'none', border: '1px solid #fca5a5', color: '#dc2626', borderRadius: 6, padding: '3px 8px', fontSize: 11, cursor: 'pointer' }}>
                        Unmatch
                      </button>
                    ) : (
                      <>
                        <span style={{ fontSize: 11, color: '#dc2626', fontWeight: 600 }}>Sure?</span>
                        <button onClick={() => unmatchAgent(a.agent_id)} disabled={unmatchingId === a.agent_id}
                          style={{ background: '#dc2626', color: 'white', border: 'none', borderRadius: 6, padding: '3px 8px', fontSize: 11, cursor: 'pointer' }}>
                          {unmatchingId === a.agent_id ? '…' : 'Yes'}
                        </button>
                        <button onClick={() => setUnmatchConfirm(null)}
                          style={{ background: 'none', border: '1px solid #d1d5db', borderRadius: 6, padding: '3px 8px', fontSize: 11, cursor: 'pointer', color: '#64748b' }}>
                          No
                        </button>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

Auth.ready({
  tool: "MLS Magic",
  button: document.getElementById("g-signin-btn"),
  onSignInNeeded: () => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("auth-gate").style.display = "flex";
  },
}).then(() => {
  document.getElementById("auth-gate").style.display = "none";
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MLSPlatform));
});

  </script>

  <script>
    // Hide the loading screen once React has rendered
    const observer = new MutationObserver(() => {
      if (document.getElementById("root").children.length > 0) {
        document.getElementById("loading").style.display = "none";
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("root"), { childList: true });
  </script>
