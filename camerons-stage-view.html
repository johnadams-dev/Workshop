<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Tour — Adams Cameron & Co.</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="Take the Virtual Tour">
<meta property="og:description" content="A custom video tour with an original song, from Adams Cameron & Co.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root { --ink:#1a1a2e; --gold:#c9a84c; --cream:#faf8f3; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; color: var(--cream); }

#stage { position: fixed; inset: 0; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.slide.active { opacity: 1; }
.slide img { width: 100%; height: 100%; object-fit: cover; animation: kenburns linear forwards; }
@keyframes kenburns { from { transform: scale(1) translate(0,0); } to { transform: scale(1.09) translate(-1%,-1%); } }

.slide-title {
  position: absolute; left: 0; right: 0; bottom: 130px; text-align: center;
  font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600;
  text-shadow: 0 2px 16px rgba(0,0,0,0.7); padding: 0 1.5rem; opacity: 0; transition: opacity 0.6s ease;
}
.slide.active .slide-title.show { opacity: 1; }

#addressBar {
  position: fixed; top: 20px; left: 0; right: 0; text-align: center; z-index: 6;
  font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600;
  text-shadow: 0 2px 10px rgba(0,0,0,0.75); padding: 0 1.5rem;
}

#lyricsCaption {
  position: fixed; left: 0; right: 0; bottom: 188px; text-align: center; z-index: 6;
  font-size: 1.05rem; font-weight: 500; padding: 0 2rem; opacity: 0; transition: opacity 0.25s ease;
  text-shadow: 0 2px 10px rgba(0,0,0,0.85);
}
#lyricsCaption.show { opacity: 1; }

#scrim-top, #scrim-bottom {
  position: fixed; left: 0; right: 0; height: 140px; pointer-events: none; z-index: 5;
}
#scrim-top { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); }
#scrim-bottom { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.65), transparent); }

#footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 22px 28px; display: flex; align-items: center; gap: 18px;
  background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.15) 80%, transparent);
}
#footer img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.1); }
#footer .name { font-weight: 600; font-size: 1.2rem; }
#footer .contact { font-size: 0.9rem; color: rgba(250,248,243,0.85); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
#footer .contact a { color: inherit; text-decoration: none; }
#footer .contact a:hover { text-decoration: underline; }
#footer .brand-logo { margin-left: auto; width: auto; height: 56px; border-radius: 0; border: none; background: none; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }

#unmute {
  position: fixed; top: 16px; right: 16px; z-index: 20;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.3); color: var(--cream);
  border-radius: 100px; padding: 8px 14px; font-size: 0.75rem; cursor: pointer; display: none; align-items: center; gap: 6px;
}

#tapOverlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.55);
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; cursor: pointer;
}
#tapOverlay .btn { background: var(--gold); color: var(--ink); border: none; padding: 14px 28px; border-radius: 100px; font-size: 1rem; font-weight: 600; font-family: inherit; }

.state-msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.75rem; text-align: center; padding: 2rem; color: rgba(250,248,243,0.7); }
.state-msg .icon { font-size: 2.5rem; }
</style>
</head>
<body>

<div id="scrim-top"></div>
<div id="scrim-bottom"></div>
<div id="stage"></div>
<div id="addressBar"></div>
<div id="lyricsCaption"></div>
<button id="unmute" onclick="unmuteAudio()">🔇 Tap for sound</button>
<div id="footer" style="display:none">
  <img id="agentPhoto" src="" alt="">
  <div>
    <div class="name" id="agentName">—</div>
    <div class="contact">
      <a id="agentPhone" href="#" style="display:none"></a>
      <a id="agentEmail" href="#" style="display:none"></a>
      <a id="listingLink" href="#" target="_blank" style="display:none">View Full Listing →</a>
    </div>
  </div>
  <img class="brand-logo" src="./images/ac-logo.png" onerror="this.style.display='none'" alt="Adams, Cameron &amp; Co.">
</div>

<div id="tapOverlay" onclick="startPlayback()">
  <div class="btn">▶ Play Tour</div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const PROXY = "https://mls-proxy-975684028597.us-east1.run.app";
const params = new URLSearchParams(location.search);
const tourId = params.get('id');
const isBranded = params.get('brand') === '1';

let tour = null;
let slideTimer = null;
let slideIndex = 0;
let includedPhotos = [];
let captionLines = []; // [{ text, start_ms, end_ms }]
let lastCaptionIdx = -1;

async function main() {
  if (!tourId) return showError('No tour specified.');
  try {
    const res = await fetch(`${PROXY}/camerons-stage/tours/${encodeURIComponent(tourId)}`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Not found');
    tour = await res.json();
  } catch (e) {
    return showError('This tour could not be found. The link may be incorrect or the tour may have been removed.');
  }

  includedPhotos = (tour.photo_config || []).filter(p => p.included !== false).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!includedPhotos.length) return showError('This tour has no photos yet.');

  document.title = (tour.address ? tour.address + ' — ' : '') + 'Virtual Tour';
  try {
    document.querySelector('meta[property="og:title"]').setAttribute('content', tour.address ? `Tour: ${tour.address}` : 'Take the Virtual Tour');
    if (includedPhotos[0]) document.head.insertAdjacentHTML('beforeend', `<meta property="og:image" content="${includedPhotos[0].url}">`);
  } catch (_) {}

  if (tour.address) document.getElementById('addressBar').textContent = tour.address;
  buildCaptionLines();
  buildStage();
  if (isBranded) buildFooter();

  const audio = document.getElementById('audio');
  audio.src = tour.audio_url;
  audio.ontimeupdate = updateCaption;
  audio.play().then(() => {
    document.getElementById('unmute').style.display = 'none';
    startSlideshow();
  }).catch(() => {
    document.getElementById('tapOverlay').style.display = 'flex';
  });
}

function startPlayback() {
  const audio = document.getElementById('audio');
  document.getElementById('tapOverlay').style.display = 'none';
  audio.play().catch(() => {});
  startSlideshow();
}

function unmuteAudio() {
  document.getElementById('audio').play().catch(() => {});
  document.getElementById('unmute').style.display = 'none';
}

function buildStage() {
  const stage = document.getElementById('stage');
  // Only current/next/previous images actually get a real src (see
  // loadSlideImage/unloadSlideImage below) — data-src holds the real URL
  // until then. Setting src on every slide up front made mobile browsers
  // try to decode/hold every full-size photo in memory simultaneously
  // (they're all stacked in the viewport via position:absolute, so
  // loading="lazy" never kicked in either), which is what was causing
  // images to go blank partway through a tour on phones.
  stage.innerHTML = includedPhotos.map((p, i) => `
    <div class="slide" data-i="${i}">
      <img data-src="${p.url}">
      ${p.title ? `<div class="slide-title show">${escapeHtml(p.title)}</div>` : ''}
    </div>
  `).join('');
  // Warm the first couple of slides so the tour starts instantly.
  loadSlideImage(0);
  loadSlideImage(1 % includedPhotos.length);
}

function loadSlideImage(i) {
  const slide = document.querySelector(`.slide[data-i="${i}"]`);
  const img = slide && slide.querySelector('img');
  if (img && !img.src && img.dataset.src) img.src = img.dataset.src;
}

function unloadSlideImage(i) {
  const slide = document.querySelector(`.slide[data-i="${i}"]`);
  const img = slide && slide.querySelector('img');
  if (img && img.src) img.removeAttribute('src');
}

// Groups per-word timestamps (from ElevenLabs' /v1/music/detailed with
// with_timestamps:true) into short on-screen lines rather than flashing one
// word at a time — every 6 words (or however many are left) becomes one line,
// shown for the span from its first word's start to its last word's end.
function buildCaptionLines() {
  const words = tour.lyrics;
  if (!Array.isArray(words) || !words.length) { captionLines = []; return; }
  const GROUP_SIZE = 6;
  const lines = [];
  for (let i = 0; i < words.length; i += GROUP_SIZE) {
    const group = words.slice(i, i + GROUP_SIZE);
    lines.push({
      text: group.map(w => w.word).join(' '),
      start_ms: group[0].start_ms,
      end_ms: group[group.length - 1].end_ms,
    });
  }
  captionLines = lines;
}

function updateCaption() {
  if (!captionLines.length) return;
  const nowMs = document.getElementById('audio').currentTime * 1000;
  const idx = captionLines.findIndex(l => nowMs >= l.start_ms && nowMs <= l.end_ms);
  if (idx === lastCaptionIdx) return;
  lastCaptionIdx = idx;
  const el = document.getElementById('lyricsCaption');
  if (idx === -1) { el.classList.remove('show'); return; }
  el.textContent = captionLines[idx].text;
  el.classList.add('show');
}

function buildFooter() {
  const a = tour.agent || {};
  // Every branded page shows this footer (and its Adams, Cameron logo)
  // regardless of whether agent contact details are on file — only the
  // agent-specific fields below are conditional.
  document.getElementById('footer').style.display = 'flex';
  if (!a.name && !a.phone && !a.email) {
    document.getElementById('agentPhoto').style.display = 'none';
    document.getElementById('agentName').parentElement.style.display = 'none';
    return;
  }
  document.getElementById('agentName').textContent = a.name || 'Your Agent';
  if (a.photo_url) document.getElementById('agentPhoto').src = a.photo_url;
  const phoneEl = document.getElementById('agentPhone');
  if (a.phone) { phoneEl.href = 'tel:' + a.phone; phoneEl.textContent = a.phone; phoneEl.style.display = 'inline'; }
  const emailEl = document.getElementById('agentEmail');
  if (a.email) { emailEl.href = 'mailto:' + a.email; emailEl.textContent = a.email; emailEl.style.display = 'inline'; }
  const listingEl = document.getElementById('listingLink');
  if (a.website && tour.mls_id) {
    listingEl.href = a.website.replace(/\/+$/, '') + '/' + tour.mls_id;
    listingEl.style.display = 'inline';
  }
}

function startSlideshow() {
  const lengthMs = tour.music_length_ms || 60000;
  const segmentMs = Math.max(2500, Math.floor(lengthMs / includedPhotos.length));
  const slides = document.querySelectorAll('.slide');
  slides.forEach(s => { const img = s.querySelector('img'); if (img) img.style.animationDuration = (segmentMs / 1000) + 's'; });

  const show = (i) => {
    slides.forEach(s => s.classList.remove('active'));
    slides[i]?.classList.add('active');

    const total = slides.length;
    const next = (i + 1) % total;
    const prev = (i - 1 + total) % total;
    loadSlideImage(i);
    loadSlideImage(next); // preload so the next transition doesn't flash blank
    for (let k = 0; k < total; k++) {
      if (k !== i && k !== next && k !== prev) unloadSlideImage(k);
    }
  };
  show(0);
  slideTimer = setInterval(() => {
    slideIndex = (slideIndex + 1) % slides.length;
    show(slideIndex);
  }, segmentMs);
}

function showError(msg) {
  document.getElementById('stage').innerHTML = `<div class="state-msg"><span class="icon">🎬</span>${escapeHtml(msg)}</div>`;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

main();
</script>
</body>
</html>
