<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commission Disbursement Form</title>
  <style>
    @page { size: letter; margin: 0.6in; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #000; background: #fff; }

    .print-btn {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      padding: 8px 18px; background: #003366; color: #fff;
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    @media print { .print-btn { display: none !important; } }

    .form-title {
      text-align: center; font-size: 14pt; font-weight: bold;
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px;
    }

    table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    td, th { border: 1px solid #000; padding: 4px 6px; vertical-align: top; font-size: 9pt; }
    td.label {
      background: #eee; font-weight: bold; font-size: 8pt;
      text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; width: 1%; padding-right: 8px;
    }
    td.val { min-width: 100px; }

    .section-head {
      background: #003366; color: #fff; font-weight: bold;
      font-size: 9pt; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 4px 8px; margin-top: 10px; margin-bottom: 2px;
    }

    .disbursement-table td { padding: 5px 8px; }
    .disbursement-table td.amt { text-align: right; min-width: 90px; }
    .disbursement-table tr.total-row td { font-weight: bold; border-top: 2px solid #000; }

    /* Commission-split work table -- the office fills in %/$/Ck#/Date/OTT/
       NSC/ACF by hand for each agent, so those columns stay blank on
       purpose. Narrow, centered header cells vs. the label/val convention
       used elsewhere in this form, since this is a real multi-column grid
       (matching the paper form's own table), not label:value pairs. */
    .work-table th {
      background: #eee; font-weight: bold; font-size: 8pt;
      text-transform: uppercase; letter-spacing: 0.03em; text-align: center;
    }
    .work-table td { height: 22px; }
    .work-table td.subhead {
      background: #f5f5f5; font-weight: bold; font-size: 8.5pt;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .work-table td.agent-name { white-space: nowrap; }

    /* New: highlights an agent's Foundation contribution level right next
       to their name, per staff request -- this is new information the
       form didn't carry before, so it's deliberately called out rather
       than blending in with the rest of the row. */
    .foundation-badge {
      display: inline-block; margin-left: 8px; padding: 1px 6px;
      background: #fdf3d8; border: 1px solid #c9a84c; border-radius: 3px;
      font-size: 7.5pt; font-weight: bold; white-space: nowrap;
    }

    .sig-row { display: flex; gap: 24px; margin-top: 20px; }
    .sig-block { flex: 1; border-top: 1px solid #000; padding-top: 4px; font-size: 8pt; }

    .loading { text-align: center; padding: 60px; font-size: 14px; color: #666; }
    .error   { text-align: center; padding: 60px; color: #c00; font-size: 14px; }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">Print</button>
  <div id="content"><div class="loading">Loading…</div></div>

<script>
const PROXY = 'https://mls-proxy-975684028597.us-east1.run.app';

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('content').innerHTML = '<div class="error">No transaction ID in URL.</div>'; return; }

  const email = localStorage.getItem('ac_user_email') || '';
  const headers = { 'Content-Type': 'application/json', 'x-user-email': email };

  try {
    const res = await fetch(PROXY + `/api/forms/transaction/${encodeURIComponent(id)}`, { headers });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function fmt(v) { return v || ''; }
function fmtMoney(v) { return v != null ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''; }
// close_date comes back as a full ISO timestamp (transaction_events.close_date
// is timestamptz, not a bare date), not the 'YYYY-MM-DD' string this
// previously assumed -- appending 'T00:00:00' to an already-full timestamp
// produced "Invalid Date". Slicing to the date portion first handles both a
// bare date string and a full timestamp the same way, then reconstructs
// LOCAL midnight for that calendar date (not UTC midnight) so
// toLocaleDateString() can't roll it back a day in a negative-UTC-offset
// timezone.
function fmtDate(v) { if (!v) return ''; const d = new Date(String(v).slice(0, 10) + 'T00:00:00'); return d.toLocaleDateString('en-US'); }
function agentName(a) { if (!a) return ''; return [a.first_name, a.last_name].filter(Boolean).join(' '); }

// Full mailing-style address on one line -- same helper as
// form-listing-contract.html's fullAddress(), applied here to the
// transaction's own property address instead of a customer's.
function fullAddress(address, city, state, zip) {
  const cityState = [city, state].filter(Boolean).join(', ');
  const cityStateZip = [cityState, zip].filter(Boolean).join(' ');
  return [address, cityStateZip].filter(Boolean).join(', ');
}

const FINANCING_LABEL = {
  cash: 'Cash', conventional: 'Conventional', fha: 'FHA', va: 'VA',
  owner_financing: 'Owner Financing', other: 'Other',
};
function financingLabel(v) { return v ? (FINANCING_LABEL[v] || v) : ''; }

function calcCommission(salePrice, rate, type) {
  if (rate == null) return null;
  if (type === 'fixed') return Math.round(Number(rate) * 100) / 100;
  if (!salePrice) return null;
  return Math.round(Number(salePrice) * (Number(rate) / 100) * 100) / 100;
}
function calcCoopCommission(salePrice, rate, type) {
  return calcCommission(salePrice, rate, type);
}
function commissionDisplay(rate, type) {
  if (rate == null) return '';
  return type === 'fixed' ? fmtMoney(rate) : `${rate}%`;
}

// A percent-type referral fee is a cut of the GROSS COMMISSION on the
// referral's own side (r.side), not of the sale price -- a buyer-side
// referral is a % of the cooperating/buyer-side commission, a listing-side
// referral is a % of the listing side (total commission minus the
// cooperating cut). Was computing straight off salePrice instead, which
// only happened to look right when commission_rate was exactly 100% --
// same bug already fixed server-side in daily-desk-routes.js's
// /referral-report; this form builds its own totals client-side and
// needed the same fix here.
function sideGrossCommission(side, totalComm, coopComm) {
  if (side === 'buyer') return coopComm;
  return (totalComm != null && coopComm != null) ? totalComm - coopComm : null;
}
function calcReferralFee(r, totalComm, coopComm) {
  if (r.fee_type === 'fixed') return Number(r.fee_value);
  const sideComm = sideGrossCommission(r.side, totalComm, coopComm);
  if (sideComm == null) return null;
  return Math.round(Number(sideComm) * (Number(r.fee_value) / 100) * 100) / 100;
}

// Donation level as recorded in active_donations -- fixed_amount is a flat
// dollar amount per closing, percentage_rate is a % of commission. Only
// fixed_amount has been seen live so far, but both are real columns.
function donationLabel(d) {
  if (!d) return '';
  if (d.fixed_amount != null) return `${fmtMoney(d.fixed_amount)}/closing`;
  if (d.percentage_rate != null) return `${d.percentage_rate}% of commission`;
  return d.donation_type || '';
}

function row2(l1, v1, l2, v2) {
  return `<tr>
    <td class="label">${l1}</td><td class="val">${v1 || '&nbsp;'}</td>
    <td class="label">${l2}</td><td class="val">${v2 || '&nbsp;'}</td>
  </tr>`;
}

// One blank-work-columns row per agent in the Commission Split table --
// %/$/Ck#/Date/OTT/NSC/ACF are filled in by hand, never computed, since
// per-agent splits/checks aren't tracked in the system. Skips agents with
// no name on file (e.g. no co-listing agent) instead of printing a blank row.
function agentWorkRow(a, donor) {
  const name = agentName(a);
  if (!name) return '';
  const badge = donor ? `<span class="foundation-badge">🌱 Foundation Donor — ${donationLabel(donor)}</span>` : '';
  return `<tr>
    <td class="agent-name">${name}${badge}</td>
    <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
  </tr>`;
}

// One block per side that actually has a referral -- omitted entirely for
// a side (or both) with none, rather than printing empty rows.
function referralBlock(sideLabel, sideRefs, totalComm, coopComm) {
  if (!sideRefs.length) return '';
  const blocks = sideRefs.map(r => {
    const name = r.agent_id ? [r.first_name, r.last_name].filter(Boolean).join(' ') : fmt(r.referral_name);
    const provider = [name, fmt(r.referral_company)].filter(Boolean).join(' — ');
    const rate = r.fee_type === 'percent' ? `${Number(r.fee_value)}%` : 'Flat Fee';
    const gciVal = calcReferralFee(r, totalComm, coopComm);
    const gci = gciVal != null ? fmtMoney(gciVal) : '';
    return `
      ${row2('Provider', provider, 'Tax ID', fmt(r.w2))}
      ${row2('Address', fmt(r.referral_address), 'Percent of Referral', rate)}
      ${row2('Amount of GCI', gci, 'Chk# / Date', '')}`;
  }).join('');
  return `
    <div class="section-head">Referral — ${sideLabel}</div>
    <table>${blocks}</table>`;
}

function render({ transaction: t, mls_number, listing_agent, co_listing_agent, buyers_agent, co_buyers_agent, closing_event, referrals, foundation_donors }) {
  const ev = closing_event || {};
  const salePrice = ev.sale_price ?? t.current_price;
  const totalComm = calcCommission(salePrice, t.commission_rate, t.commission_type);
  const coopComm  = calcCoopCommission(salePrice, t.cooperating_commission, t.commission_type);

  // Only show/count NSC for a side we actually represent -- a pure
  // buyer-side contract can still be carrying a stale listing_non_shared_
  // commission value from before daily-desk-routes.js's POST /contracts fix
  // (it used to fall through to the table's $250 DEFAULT for the side we
  // don't represent). Showing that here would be actively misleading, and
  // accComm below would overstate ACC's actual take from the deal.
  const listingNsc = t.represents_seller ? t.listing_non_shared_commission : null;
  const buyerNsc   = t.represents_buyer  ? t.buyer_non_shared_commission   : null;

  // Adams, Cameron's true total take: net of the shared commission split
  // plus both non-shared commissions (NSC) -- flat amounts ACC collects
  // and does not split with the cooperating brokerage.
  const hasAnyComm = totalComm != null || coopComm != null || listingNsc != null || buyerNsc != null;
  const accComm = hasAnyComm
    ? (totalComm != null && coopComm != null ? totalComm - coopComm : 0)
      + Number(listingNsc || 0) + Number(buyerNsc || 0)
    : null;
  const refs = referrals || [];
  // side is 'buyer' or 'seller' (transaction_referrals defaults new rows to
  // 'seller' -- see daily-desk-routes.js's POST /transactions/:id/referrals)
  const listingRefs = refs.filter(r => r.side !== 'buyer');
  const buyerRefs   = refs.filter(r => r.side === 'buyer');

  const donors = foundation_donors || [];
  const donorByAgentId = new Map(donors.map(d => [d.agent_id, d]));

  document.getElementById('content').innerHTML = `
    <div class="form-title">Commission Disbursement Form</div>

    <table>
      <tr><td class="label">Property Address</td><td class="val" colspan="3">${fullAddress(t.property_address, t.city, t.state, t.zip)}</td></tr>
      ${row2('Sale Price', fmtMoney(salePrice), 'Commission', commissionDisplay(t.commission_rate, t.commission_type))}
      ${row2('Commission Check Amount', fmtMoney(totalComm), 'Non-Shared Commission', [
        listingNsc != null ? `${fmtMoney(listingNsc)} (Listing)` : null,
        buyerNsc != null ? `${fmtMoney(buyerNsc)} (Buyer)` : null,
      ].filter(Boolean).join(' / '))}
    </table>

    <div class="section-head">Closing Information</div>
    <table>
      ${row2('MLS Number', fmt(mls_number), 'Office', fmt(t.office_name))}
      ${row2('Closing Date', fmtDate(ev.close_date), 'Closing Agent', fmt(ev.title_company))}
      ${row2('Mortgage Company', fmt(ev.mortgage_company), 'Type of Financing', financingLabel(ev.financing_type))}
    </table>

    <div class="section-head">Commission Split</div>
    <table class="work-table">
      <thead>
        <tr><th style="width:26%">Agent</th><th>%</th><th>$</th><th>Ck#</th><th>Date</th><th>OTT</th><th>NSC</th><th>ACF</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="8" class="subhead">Listing Agent</td></tr>
        ${agentWorkRow(listing_agent, donorByAgentId.get(listing_agent?.agent_id)) || `<tr><td class="agent-name">&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`}
        ${agentWorkRow(co_listing_agent, donorByAgentId.get(co_listing_agent?.agent_id))}
        <tr><td colspan="8" class="subhead">Selling Agent</td></tr>
        ${agentWorkRow(buyers_agent, donorByAgentId.get(buyers_agent?.agent_id)) || `<tr><td class="agent-name">&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`}
        ${agentWorkRow(co_buyers_agent, donorByAgentId.get(co_buyers_agent?.agent_id))}
      </tbody>
    </table>

    ${referralBlock('Listing Side', listingRefs, totalComm, coopComm)}
    ${referralBlock('Buyer Side', buyerRefs, totalComm, coopComm)}

    <div class="section-head">Commission Summary</div>
    <table class="disbursement-table">
      <tr>
        <td>Total Commission (${commissionDisplay(t.commission_rate, t.commission_type) || '&nbsp;'})</td>
        <td class="amt">${fmtMoney(totalComm)}</td>
        <td style="width:50%">&nbsp;</td>
      </tr>
      <tr>
        <td>Co-Op Commission (${commissionDisplay(t.cooperating_commission, t.commission_type) || '&nbsp;'})</td>
        <td class="amt">${fmtMoney(coopComm)}</td>
        <td style="font-size:8pt; color:#555;">Paid to buyer's brokerage</td>
      </tr>
      ${listingNsc != null ? `<tr>
        <td>Non-Shared Commission (Listing)</td>
        <td class="amt">${fmtMoney(listingNsc)}</td>
        <td>&nbsp;</td>
      </tr>` : ''}
      ${buyerNsc != null ? `<tr>
        <td>Non-Shared Commission (Buyer)</td>
        <td class="amt">${fmtMoney(buyerNsc)}</td>
        <td>&nbsp;</td>
      </tr>` : ''}
      <tr class="total-row">
        <td>Adams, Cameron Net Commission</td>
        <td class="amt">${fmtMoney(accComm)}</td>
        <td>&nbsp;</td>
      </tr>
    </table>

    <div class="sig-row">
      <div class="sig-block">Coordinator Signature</div>
      <div class="sig-block">Date</div>
    </div>
  `;
}

load();
</script>
</body>
</html>
