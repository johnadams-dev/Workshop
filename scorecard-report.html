<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard Report · Adams Cameron & Co.</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Shell (auth gate, topbar, tables, buttons, filters) copied from
   review-engine.html — same dark manager-dashboard theme, same DI/auth
   convention, per scorecard-report-plan.md's "modeled on review-engine.html's
   shell" instruction. */
:root {
  --ink:        #0d1117;
  --ink-mid:    #161b22;
  --ink-light:  #21262d;
  --ink-border: #30363d;
  --amber:      #d29922;
  --amber-bg:   rgba(210,153,34,.12);
  --green:      #3fb950;
  --green-bg:   rgba(63,185,80,.1);
  --red:        #f85149;
  --red-bg:     rgba(248,81,73,.1);
  --blue:       #58a6ff;
  --blue-bg:    rgba(88,166,255,.1);
  --text:       #e6edf3;
  --text-muted: #8b949e;
  --text-dim:   #484f58;
  --mono:       'IBM Plex Mono', monospace;
  --sans:       'IBM Plex Sans', sans-serif;
  --r:          6px;
  /* Chart series — dataviz reference palette's dark steps, validated
     (validate_palette.js, all-pairs) against the card surface #161b22. */
  --series-1:   #3987e5;
  --series-2:   #d95926;
  --series-3:   #199e70;
  --grid:       #262c34;
  --axis:       #3b434d;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--sans); background: var(--ink); color: var(--text); min-height: 100vh; }

#auth-gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1.5rem; }
#auth-gate h1 { font-size: 1.4rem; color: var(--amber); }
#auth-gate p  { color: var(--text-muted); font-size: 0.9rem; }

.topbar {
  background: var(--ink-mid); border-bottom: 1px solid var(--ink-border);
  padding: 0 1rem; height: 48px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 0.85rem; font-weight: 600; letter-spacing: .05em; color: var(--text-muted); }
.topbar-title span { color: var(--amber); }
.topbar-back { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; }
.topbar-back:hover { color: var(--text); }

.content { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

.filters { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1.1rem; flex-wrap: wrap; }
.filters input, .filters select {
  background: var(--ink-light); border: 1px solid var(--ink-border); border-radius: var(--r);
  padding: 0.4rem 0.75rem; color: var(--text); font: inherit; font-size: 0.82rem;
}
.filters-note { font-size: 0.76rem; color: var(--text-muted); }
.view-links { margin-left: auto; display: flex; gap: 0.9rem; font-size: 0.8rem; }
.view-links a { color: var(--blue); text-decoration: none; }
.view-links a:hover { text-decoration: underline; }
.view-links a.current { color: var(--text-muted); pointer-events: none; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th {
  background: var(--ink-light); color: var(--text-muted); font-weight: 500; text-align: left;
  padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ink-border); white-space: nowrap;
}
td { padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ink-border); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }

.btn {
  display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem;
  border-radius: var(--r); font: inherit; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; transition: opacity .15s; background: var(--ink-light);
  color: var(--text); border: 1px solid var(--ink-border);
}
.btn:hover { opacity: .8; }
.btn-sm { padding: 0.2rem 0.55rem; font-size: 0.72rem; }

.rate-low  { color: var(--amber); }
.rate-ok   { color: var(--green); }
.loading, .empty-state { color: var(--text-muted); padding: 1rem 0; }
#report-output.refreshing { opacity: .55; transition: opacity .15s; }

/* ── Main page: key-indicator cards ── */
.kpi-section { margin-bottom: 1.6rem; }
.section-title {
  font-size: 0.76rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--amber); margin-bottom: 0.55rem;
}
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; }
.kpi-card {
  display: block; background: var(--ink-mid); border: 1px solid var(--ink-border); border-radius: 8px;
  padding: 0.85rem 0.95rem 0.6rem; color: inherit; text-decoration: none; transition: border-color .15s;
}
a.kpi-card:hover, a.kpi-card:focus-visible { border-color: var(--blue); outline: none; }
.kpi-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.kpi-label { font-size: 0.84rem; font-weight: 500; }
.kpi-month { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
.kpi-value-row { display: flex; align-items: baseline; gap: 0.6rem; margin: 0.3rem 0 0.15rem; flex-wrap: wrap; }
.kpi-value { font-size: 1.75rem; font-weight: 600; line-height: 1.1; }
.kpi-goal { font-size: 0.74rem; color: var(--text-muted); }
.status { font-size: 0.74rem; font-weight: 500; white-space: nowrap; }
.status.ok { color: var(--green); }
.status.low { color: var(--amber); }
.kpi-delta { font-size: 0.74rem; color: var(--text-muted); min-height: 1.1em; }
.delta-good { color: var(--green); }
.delta-bad { color: var(--amber); }
.kpi-chart { margin-top: 0.35rem; }
.kpi-card.untracked { border-style: dashed; background: transparent; }
.kpi-card.untracked .kpi-value { font-size: 1rem; font-weight: 500; color: var(--text-muted); margin: 0.4rem 0 0.2rem; }
.kpi-card.untracked p { font-size: 0.74rem; color: var(--text-muted); line-height: 1.45; }

/* ── Detail page ── */
.detail-back { font-size: 0.8rem; color: var(--blue); text-decoration: none; }
.detail-back:hover { text-decoration: underline; }
.detail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0 1rem; }
.detail-head h1 { font-size: 1.35rem; font-weight: 600; }
.detail-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
.detail-stats { display: flex; gap: 1.6rem; flex-wrap: wrap; }
.stat .stat-label { font-size: 0.72rem; color: var(--text-muted); }
.stat .stat-value { font-size: 1.15rem; font-weight: 600; }
.panel { background: var(--ink-mid); border: 1px solid var(--ink-border); border-radius: 8px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
.panel-title { font-size: 0.86rem; font-weight: 600; margin-bottom: 0.15rem; }
.panel-sub { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.6rem; }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; }
.legend-key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 0.35rem; border-radius: 1px; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.9rem; }
.multiple-title { font-size: 0.8rem; font-weight: 500; display: flex; justify-content: space-between; gap: 0.5rem; }
.multiple-title span { color: var(--text-muted); font-weight: 400; }
.support-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.9rem; }
.goal-edit-row { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; margin-top: 0.4rem; }
.goal-edit-row input, .goal-edit-row select {
  background: var(--ink-light); border: 1px solid var(--ink-border); border-radius: var(--r);
  color: var(--text); font: inherit; font-size: 0.74rem; padding: 0.2rem 0.4rem;
}
.goal-edit-row input[type=number] { width: 90px; }

/* ── Charts ── */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .hit { cursor: crosshair; }
.chart-tip {
  position: absolute; pointer-events: none; background: var(--ink-light); border: 1px solid var(--ink-border);
  border-radius: 6px; padding: 0.4rem 0.55rem; font-size: 0.74rem; white-space: nowrap; display: none; z-index: 5;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
.chart-tip .tip-month { color: var(--text-muted); margin-bottom: 0.2rem; }
.chart-tip .tip-row { display: flex; align-items: center; gap: 0.4rem; }
.chart-tip .tip-row strong { font-weight: 600; }
.chart-tip .tip-row span { color: var(--text-muted); }

/* ── All-metrics table (the previous full report) ── */
.metric-group { margin-bottom: 1.6rem; }
.metric-detail { font-size: 0.74rem; color: var(--text-dim); margin-top: 0.1rem; }
.breakdown-toggle { background: none; border: none; color: var(--blue); font: inherit; font-size: 0.72rem; cursor: pointer; padding: 0; }
.breakdown-toggle:hover { text-decoration: underline; }
.breakdown-row td { background: rgba(255,255,255,.015); padding: 0; }
.breakdown-row th, .breakdown-row td { padding: 0.4rem 0.9rem 0.4rem 2rem; }
.goal-set   { font-size: 0.78rem; font-family: var(--mono); }
.goal-none  { color: var(--text-dim); font-size: 0.76rem; }
.metric-link { color: var(--text); text-decoration: none; }
.metric-link:hover { color: var(--blue); }

@media (max-width: 640px) {
  .view-links { margin-left: 0; width: 100%; }
  .kpi-value { font-size: 1.5rem; }
}
</style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-gate">
  <h1>Scorecard Report</h1>
  <p>Sign in with your Adams Cameron account to continue.</p>
  <div id="g-signin-btn"></div>
</div>

<!-- App (hidden until auth) -->
<div id="app" style="display:none">
  <div class="topbar">
    <span class="topbar-title">Scorecard <span>Report</span></span>
    <div style="display:flex;align-items:center;gap:1rem">
      <a href="./feedback.html?tool=scorecard-report" class="topbar-back">Feedback</a>
      <a href="index.html" class="topbar-back">← Tools</a>
    </div>
  </div>

  <div class="content">
    <div class="filters">
      <input type="month" id="filter-month" onchange="loadData()" title="Latest month shown">
      <select id="filter-office" onchange="loadData()" title="Office">
        <option value="">All Offices</option>
      </select>
      <select id="filter-range" onchange="render()" title="Chart range" style="display:none">
        <option value="12">Last 12 months</option>
        <option value="24" selected>Last 24 months</option>
        <option value="36">Last 36 months</option>
      </select>
      <span class="filters-note" id="filters-note">Office changes Listing Tours and the capture rates; the rest are company-wide.</span>
      <nav class="view-links">
        <a href="#" id="link-scorecard">Scorecard</a>
        <a href="#all" id="link-all">All metrics</a>
      </nav>
    </div>

    <div id="report-output"><div class="loading">Loading…</div></div>
  </div>
</div>

<script>
const PROXY = "https://mls-proxy-975684028597.us-east1.run.app";
const GOOGLE_CLIENT_ID = "205198562122-ruhu1eemehs3nfgss3d1jdah47m8eadf.apps.googleusercontent.com";

let proxyKey  = localStorage.getItem("ac_proxy_key") || "";
let userEmail = localStorage.getItem("ac_user_email") || "";

// ── Auth — same pattern as review-engine.html ───────────────────────────────
if (proxyKey && userEmail && localStorage.getItem("ac_is_manager") === "1") {
  document.getElementById("auth-gate").style.display = "none";
  document.getElementById("app").style.display       = "block";
  window.addEventListener("load", initApp);
}

window.addEventListener("load", () => {
  google.accounts.id.initialize({
    client_id:             GOOGLE_CLIENT_ID,
    callback:              handleGoogleSignIn,
    auto_select:           true,
    cancel_on_tap_outside: false,
  });
  google.accounts.id.renderButton(
    document.getElementById("g-signin-btn"),
    { theme: "outline", size: "large", width: 280, text: "signin_with" }
  );
  if (!proxyKey || !userEmail || localStorage.getItem("ac_is_manager") !== "1") google.accounts.id.prompt();
});

async function handleGoogleSignIn(response) {
  try {
    const payload = JSON.parse(atob(response.credential.split(".")[1]));
    userEmail = payload.email || "";
    localStorage.setItem("ac_user_email", userEmail);
  } catch { userEmail = ""; }

  try {
    const r = await fetch(`${PROXY}/config/init`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ idToken: response.credential }),
    });
    const data = await r.json();
    if (!r.ok) { alert(data.error || "Sign-in failed. Use your @adamscameron.com account."); return; }
    proxyKey = data.proxyKey || "";
    localStorage.setItem("ac_proxy_key", proxyKey);

    if (localStorage.getItem("ac_is_manager") !== "1") {
      const mr = await fetch(`${PROXY}/auth/is-manager`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ idToken: response.credential }),
      });
      const md = await mr.json();
      if (!md.isManager) {
        alert("This tool requires manager or admin access.");
        window.location.href = "index.html";
        return;
      }
      localStorage.setItem("ac_is_manager", "1");
    }

    document.getElementById("auth-gate").style.display = "none";
    document.getElementById("app").style.display       = "block";
    initApp();
  } catch (e) {
    alert("Authentication error: " + e.message);
  }
}

// ── API helpers ──────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = {
    "Content-Type": "application/json",
    "x-proxy-key":  proxyKey,
    "x-user-email": userEmail,
    ...(opts.headers || {}),
  };
  const res = await fetch(PROXY + path, { ...opts, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}
const GET = (path) => api(path);

function esc(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ════════════════════════════════════════════════════════════════════════════
// The scorecard — the key indicators the leadership team has historically
// reported on (the "ACC Scorecard" list, 2026-10), in that list's order.
// These and only these are on the main page; everything else the rollup
// collects lives on each indicator's detail page (its `support` metrics) or
// the All Metrics view.
//
// `goal` is that list's target. It's the fallback when the metric has no goal
// of its own: a goal set in scr_metric_catalog (Edit goal on the detail page)
// wins, and the computed ratios (derived_*) carry their goal from the server.
// `untracked` items are on the scorecard but have no data source in the
// rollup yet — shown as placeholders rather than dropped, so the gap stays
// visible.
// ════════════════════════════════════════════════════════════════════════════
const SCORECARD = [
  { section: "Retention & Recruiting", items: [
    { key: "derived_added_rate",          label: "Added (annualized)",              support: ["associates_added", "dbpr_active_acc"] },
    { key: "derived_terminated_rate",     label: "Terminated (annualized)",         support: ["associates_terminated", "dbpr_active_acc"] },
    { key: "derived_lost_rate",           label: "Lost, not incl. RR (annualized)", support: ["associates_terminated", "derived_terminated_rate", "dbpr_active_acc"] },
    { key: "derived_caravans_per_listing", label: "Caravans / New Listing",         support: ["Caravans-Held", "New-Listings"] },
    { key: "Social-OpenRate",             label: "AC Social Open Rate", goal: { value: 50, direction: "above" }, support: ["Social-ActiveUsers", "Social-Stories", "Social-Shares", "Social-Reach"] },
  ]},
  { section: "Office Productivity", items: [
    { label: "Agent Support Time", untracked: true, note: "A long-wanted measure with no reliable way to track it yet." },
  ]},
  { section: "Marketing", items: [
    { key: "derived_listing_tour_rate", label: "Listing Tours", pendingNote: "Starts with the next monthly virtual-tour snapshot: the share of tour-eligible listings (not land or commercial) with a qualifying tour, by Daily Desk's Virtual Tours rules. Goal ≥ 95%.", support: ["vtours_eligible", "vtours_needs_replacement", "vtours_needs_new_tour", "vtours_needs_link_paste"] },
    { key: "derived_positive_review_rate", label: "Positive Reviews", support: ["reviews_positive", "reviews_total", "reviews_google", "reviews_facebook", "reviews_zillow"] },
    { key: "derived_reviews_per_closing",  label: "Reviews / Closing", support: ["reviews_total", "Total-Closings", "reviews_google", "reviews_facebook", "reviews_zillow"] },
  ]},
  { section: "Visits", items: [
    { key: "derived_cost_per_visit", label: "Cost / Visit", support: ["Advertising-Spend", "Visitors-Delta-Returning", "Visitors-Delta-FirstTime", "Visitors-GoogleAnalytics"] },
    { key: "derived_cost_per_lead",  label: "Cost / Lead",  support: ["Advertising-Spend", "Leads-Delta"] },
  ]},
  { section: "eLead", items: [
    { key: "Leads-Inbound-Distributed", label: "Leads Distributed",           goal: { value: 88, direction: "above" },      support: ["Leads-Inbound-Closings", "derived_inbound_close_rate"] },
    { key: "derived_inbound_close_rate", label: "Inbound Close Rate",                                                         support: ["Leads-Inbound-Closings", "Leads-Inbound-Distributed"] },
    { key: "LRE-Outbound-Closings",     label: "Outbound LRE Closings",       goal: { value: 2.5, direction: "above" },     support: ["LRE-Outbound-Sent", "derived_lre_close_rate", "LRE-Outbound-Revenue"] },
    { key: "LRE-Outbound-Revenue",      label: "Outbound LRE Closings $$",    goal: { value: 1000000, direction: "above" }, support: ["LRE-Outbound-Closings", "LRE-Outbound-Sent"] },
  ]},
  { section: "Capture", items: [
    { key: "title_capture_rate",    label: "Title",    goal: { value: 50, direction: "above" }, support: ["title_capture_matched", "title_capture_recorded"] },
    { key: "mortgage_capture_rate", label: "Mortgage",                                           support: ["mortgage_capture_matched", "mortgage_capture_recorded"] },
  ]},
];
const SCORECARD_BY_KEY = {};
for (const s of SCORECARD) for (const it of s.items) if (it.key) SCORECARD_BY_KEY[it.key] = it;

const MONTHS_FETCHED = 36; // one fetch feeds every view: cards use the last 13+, detail up to 36
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let _data = null;        // last /metrics/trend response (36 months)
let _metrics = {};       // metric_key -> metric
let _officeCache = {};   // `${metric_key}|${end}` -> /metrics/trend/by-office response
let _loadSeq = 0;

function initApp() {
  // Default to last month: the monthly rollup only fills a month in after it
  // ends, so the current month is always empty.
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  document.getElementById("filter-month").value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  loadOffices();
  window.addEventListener("hashchange", render);
  loadData();
}

async function loadOffices() {
  try {
    const offices = await GET("/offices");
    const sel = document.getElementById("filter-office");
    sel.innerHTML = '<option value="">All Offices</option>' +
      offices.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("");
  } catch (e) { /* non-critical — office filter just stays "All Offices" only */ }
}

async function loadData() {
  const seq = ++_loadSeq;
  const out = document.getElementById("report-output");
  if (_data) out.classList.add("refreshing"); // keep the previous render while refetching
  else out.innerHTML = '<div class="loading">Loading…</div>';
  const qs = new URLSearchParams({ end_month: document.getElementById("filter-month").value, months: MONTHS_FETCHED });
  const officeId = document.getElementById("filter-office").value;
  if (officeId) qs.set("office_id", officeId);
  try {
    const data = await GET(`/scorecard/metrics/trend?${qs}`);
    if (seq !== _loadSeq) return;
    _data = data;
    _metrics = {};
    for (const g of data.groups) for (const m of g.metrics) _metrics[m.metric_key] = m;
    _officeCache = {};
    render();
  } catch (e) {
    if (seq !== _loadSeq) return;
    out.innerHTML = `<div class="empty-state" style="color:var(--red)">Error: ${esc(e.message)}</div>`;
  } finally {
    out.classList.remove("refreshing");
  }
}

// ── Routing: "" = scorecard, "#m=<key>" = detail, "#all" = every metric ────
function currentRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h === "all") return { view: "all" };
  if (h.startsWith("m=")) return { view: "detail", key: h.slice(2) };
  return { view: "main" };
}

function render() {
  if (!_data) return;
  const route = currentRoute();
  document.getElementById("filter-range").style.display = route.view === "detail" ? "" : "none";
  document.getElementById("link-scorecard").classList.toggle("current", route.view === "main");
  document.getElementById("link-all").classList.toggle("current", route.view === "all");
  CHARTS.clear();
  const out = document.getElementById("report-output");
  if (route.view === "all") out.innerHTML = renderAllMetrics();
  else if (route.view === "detail") { out.innerHTML = renderDetail(route.key); loadOfficePanel(route.key); }
  else out.innerHTML = renderMain();
  if (route.view !== "main") window.scrollTo(0, 0);
}

// ── Formatting ───────────────────────────────────────────────────────────────
function fmtValue(value, unit, { compact = false } = {}) {
  if (value === null || value === undefined) return "—";
  const n = Number(value);
  if (unit === "percent") return `${n.toFixed(1)}%`;
  if (unit === "currency") {
    if (compact && Math.abs(n) >= 1e6) return "$" + (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
    if (compact && Math.abs(n) >= 1e4) return "$" + Math.round(n / 1e3).toLocaleString() + "K";
    return "$" + n.toLocaleString(undefined, { maximumFractionDigits: Math.abs(n) < 10 ? 2 : 0, minimumFractionDigits: Math.abs(n) < 10 && n % 1 ? 2 : 0 });
  }
  if (compact && Math.abs(n) >= 1e4) return Math.round(n / 1e3).toLocaleString() + "K";
  return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}
// "Sep '25" — month plus 2-digit year, so a 24/36-month axis is unambiguous
function shortMonth(periodDate) {
  const [y, m] = periodDate.split("-").map(Number);
  return `${MON[m - 1]} '${String(y).slice(2)}`;
}
function monthLabel(periodDate, withYear = true) {
  const [y, m] = periodDate.split("-").map(Number);
  return withYear ? `${MON[m - 1]} ${y}` : MON[m - 1];
}

// The goal in force: the metric's own (catalog, or server-side for computed
// ratios) first, then the scorecard list's target as a fallback.
function effectiveGoal(m, cfg) {
  if (m && m.target_value != null && m.target_direction && m.target_direction !== "none") {
    return { value: m.target_value, direction: m.target_direction, source: "metric" };
  }
  if (cfg && cfg.goal) return { ...cfg.goal, source: "scorecard" };
  return null;
}
function meetsGoal(value, goal) {
  if (value == null || !goal) return null;
  return goal.direction === "above" ? value >= goal.value : value <= goal.value;
}
function goalText(goal, unit) {
  if (!goal) return "No goal set";
  return `Goal ${goal.direction === "above" ? "≥" : "≤"} ${fmtValue(goal.value, unit, { compact: true })}`;
}
function statusHtml(value, goal, unit) {
  const meets = meetsGoal(value, goal);
  if (meets == null) return "";
  return meets
    ? `<span class="status ok">✓ On goal</span>`
    : `<span class="status low">✗ ${goal.direction === "above" ? "Below goal" : "Over limit"}</span>`;
}

// Listing Tours: points carried over from the legacy Listing Videos count
// (see GET /metrics/trend's legacy_months) are labelled wherever they show.
function isLegacy(m, periodDate) { return !!(m.legacy_months && m.legacy_months.includes(periodDate)); }

function lastIndex(series) {
  for (let i = series.length - 1; i >= 0; i--) if (series[i].value != null) return i;
  return -1;
}

// Change vs the same month a year earlier — the comparison that holds up
// across busy and slow seasons. Points for rates, percent for everything else.
function yoyDelta(m, goal) {
  const i = lastIndex(m.series);
  if (i < 12) return null;
  const now = m.series[i].value, prior = m.series[i - 12].value;
  if (prior == null) return null;
  const diff = now - prior;
  let text;
  if (m.unit === "percent") text = `${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)} pts`;
  else if (prior !== 0) text = `${diff >= 0 ? "+" : "−"}${Math.abs(diff / prior * 100).toFixed(0)}%`;
  else text = `${diff >= 0 ? "+" : "−"}${fmtValue(Math.abs(diff), m.unit)}`;
  const better = goal ? (goal.direction === "above" ? diff > 0 : diff < 0) : null;
  const cls = diff === 0 || better == null ? "" : better ? "delta-good" : "delta-bad";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "▶";
  return `<span class="${cls}">${arrow} ${text}</span> vs ${monthLabel(m.series[i - 12].period_date)}`;
}

// ════════════════════════════════════════════════════════════════════════════
// Charts — hand-built SVG line charts. 2px lines, hairline solid grid, one
// y-axis, goal as a labelled reference line, end-dot with a surface ring and
// the value labelled at the end; text in text colors, never series colors.
// Interactive charts get a crosshair + tooltip listing every series at that
// month (the month table under each detail chart carries the same values
// without hovering).
// ════════════════════════════════════════════════════════════════════════════
const CHARTS = new Map();
let _chartSeq = 0;

function niceTicks(min, max, count) {
  if (min === max) {
    if (min >= 0) { max = min === 0 ? 1 : min * 1.2; min = 0; } // flat non-negative series: anchor at zero, never a negative count
    else { const pad = Math.abs(min) * 0.1; min -= pad; max += pad; }
  }
  const raw = (max - min) / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}

function lineChart({ series, labels, tipLabels = null, unit, goal, width = 720, height = 280, compact = false, interactive = true, yDomain = null, endLabels = true, xEvery = null }) {
  const id = "c" + (++_chartSeq);
  const fontSize = compact ? 10.5 : 11.5;
  const left = compact ? 36 : 50, right = endLabels ? (compact ? 44 : 64) : 12, top = compact ? 8 : 14, bottom = compact ? 18 : 24;
  const n = labels.length;
  const vals = series.flatMap(s => s.values).filter(v => v != null);
  let lo, hi;
  if (yDomain) [lo, hi] = yDomain;
  else {
    lo = Math.min(...vals, goal ? goal.value : Infinity);
    hi = Math.max(...vals, goal ? goal.value : -Infinity);
    if (!vals.length && !goal) { lo = 0; hi = 1; }
    if (lo >= 0 && lo < hi * 0.35) lo = 0; // anchor at zero unless that flattens the line
  }
  const ticks = niceTicks(lo, hi, compact ? 2 : 4);
  const y0v = ticks[0], y1v = ticks[ticks.length - 1];
  const X = i => left + (n > 1 ? i / (n - 1) : 0.5) * (width - left - right);
  const Y = v => top + (1 - (v - y0v) / (y1v - y0v || 1)) * (height - top - bottom);
  const tickFmt = v => (unit === "percent" && Number.isInteger(v)) ? `${v}%` : fmtValue(v, unit, { compact: true });

  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(series.map(s => s.name).join(", "))} by month" font-size="${fontSize}" font-family="IBM Plex Sans, sans-serif">`;
  for (const t of ticks) {
    svg += `<line x1="${left}" x2="${width - right}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === ticks[0] ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/>`;
    if (!compact || t === ticks[0] || t === ticks[ticks.length - 1]) {
      svg += `<text x="${left - 6}" y="${Y(t) + 4}" text-anchor="end" fill="var(--text-muted)" style="font-variant-numeric:tabular-nums">${esc(tickFmt(t))}</text>`;
    }
  }
  const every = xEvery || (compact ? Math.max(1, n - 1) : n <= 12 ? 1 : n <= 24 ? 3 : 6);
  for (let i = 0; i < n; i++) {
    const isLast = i === n - 1;
    if (i % every !== 0 && !isLast) continue;
    if (!isLast && n - 1 - i < every / 2 && every > 1) continue; // keep the last label clear of its neighbour
    svg += `<text x="${X(i)}" y="${height - 5}" text-anchor="middle" fill="var(--text-muted)">${esc(labels[i])}</text>`;
  }
  if (goal && goal.value >= y0v && goal.value <= y1v) {
    svg += `<line x1="${left}" x2="${width - right}" y1="${Y(goal.value)}" y2="${Y(goal.value)}" stroke="var(--text-muted)" stroke-width="1.25" stroke-opacity=".7"/>`;
    if (!compact) svg += `<text x="${width - right + 4}" y="${Y(goal.value) + 4}" fill="var(--text-muted)">Goal ${esc(tickFmt(goal.value))}</text>`;
  }
  const ends = [];
  for (const s of series) {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
      pen = true;
    });
    // a lone point between gaps has no segment to draw — give it a dot
    s.values.forEach((v, i) => {
      if (v != null && (i === 0 || s.values[i - 1] == null) && (i === n - 1 || s.values[i + 1] == null)) {
        svg += `<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${s.color}"/>`;
      }
    });
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.opacity ? ` stroke-opacity="${s.opacity}"` : ""}/>`;
    const li = lastIndex(s.values.map(v => ({ value: v })));
    if (li >= 0) ends.push({ x: X(li), y: Y(s.values[li]), v: s.values[li], color: s.color, emph: !s.opacity });
  }
  for (const e of ends) {
    svg += `<circle cx="${e.x}" cy="${e.y}" r="${compact ? 3.5 : 4}" fill="${e.color}" stroke="var(--ink-mid)" stroke-width="2"/>`;
  }
  if (endLabels) {
    // end values, nudged apart only if two would overprint
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 12) ends[i].ly = ends[i - 1].ly + 12;
    for (const e of ends) {
      e.ly = e.ly || e.y;
      svg += `<text x="${e.x + 8}" y="${e.ly + 4}" fill="var(--text)" font-weight="${e.emph ? 600 : 400}">${esc(fmtValue(e.v, unit, { compact: true }))}</text>`;
    }
  }
  if (interactive) {
    svg += `<line class="xhair" x1="0" x2="0" y1="${top}" y2="${height - bottom}" stroke="var(--text-muted)" stroke-width="1" style="display:none" pointer-events="none"/>`;
    svg += `<rect class="hit" data-chart="${id}" x="${left - 8}" y="${top}" width="${width - left - right + 16}" height="${height - top - bottom}" fill="transparent"/>`;
    CHARTS.set(id, { series, labels: tipLabels || labels, unit, X, n, width, top, bottom, height });
  }
  svg += `</svg>`;
  return `<div class="chart-wrap" id="${id}">${svg}${interactive ? `<div class="chart-tip"></div>` : ""}</div>`;
}

// One delegated handler for every interactive chart on the page.
document.addEventListener("pointermove", (ev) => {
  const hit = ev.target.closest && ev.target.closest(".hit");
  document.querySelectorAll(".chart-wrap .xhair").forEach(l => { if (!hit || !l.closest(".chart-wrap").contains(hit)) l.style.display = "none"; });
  document.querySelectorAll(".chart-wrap .chart-tip").forEach(t => { if (!hit || !t.closest(".chart-wrap").contains(hit)) t.style.display = "none"; });
  if (!hit) return;
  const c = CHARTS.get(hit.dataset.chart);
  if (!c) return;
  const wrap = hit.closest(".chart-wrap"), svgEl = wrap.querySelector("svg");
  const box = svgEl.getBoundingClientRect(), scale = box.width / c.width;
  const vx = (ev.clientX - box.left) / scale;
  let best = 0, bestD = Infinity;
  for (let i = 0; i < c.n; i++) { const d = Math.abs(c.X(i) - vx); if (d < bestD) { bestD = d; best = i; } }
  const line = wrap.querySelector(".xhair");
  line.setAttribute("x1", c.X(best)); line.setAttribute("x2", c.X(best)); line.style.display = "";
  const tip = wrap.querySelector(".chart-tip");
  tip.textContent = "";
  const head = document.createElement("div"); head.className = "tip-month"; head.textContent = c.labels[best]; tip.appendChild(head);
  for (const s of c.series) {
    const row = document.createElement("div"); row.className = "tip-row";
    const key = document.createElement("i"); key.className = "legend-key"; key.style.background = s.color; key.style.marginRight = "0";
    const val = document.createElement("strong"); val.textContent = fmtValue(s.values[best], c.unit);
    const name = document.createElement("span"); name.textContent = s.name;
    row.append(key, val, name); tip.appendChild(row);
  }
  tip.style.display = "block";
  const px = c.X(best) * scale;
  tip.style.left = Math.min(Math.max(0, px + 12), box.width - tip.offsetWidth) + "px";
  tip.style.top = (ev.clientY - box.top - tip.offsetHeight - 12 < 0 ? ev.clientY - box.top + 16 : ev.clientY - box.top - tip.offsetHeight - 12) + "px";
});

// ════════════════════════════════════════════════════════════════════════════
// Main page — the scorecard
// ════════════════════════════════════════════════════════════════════════════
function renderMain() {
  return SCORECARD.map(sec => `
    <section class="kpi-section">
      <div class="section-title">${esc(sec.section)}</div>
      <div class="kpi-grid">${sec.items.map(renderCard).join("")}</div>
    </section>`).join("") +
    `<p class="filters-note">Each card compares its latest month with the same month a year earlier, so seasonal swings compare like with like. Click a card for its full history, year-over-year view, office breakdown and supporting numbers.</p>`;
}

function renderCard(cfg) {
  if (cfg.untracked) {
    return `<div class="kpi-card untracked">
      <div class="kpi-head"><span class="kpi-label">${esc(cfg.label)}</span>${cfg.goalText ? `<span class="kpi-month">Goal ${esc(cfg.goalText)}</span>` : ""}</div>
      <div class="kpi-value">Not tracked yet</div>
      <p>${esc(cfg.note || "")}</p>
    </div>`;
  }
  const m = _metrics[cfg.key];
  if (!m) {
    return `<div class="kpi-card untracked"><div class="kpi-head"><span class="kpi-label">${esc(cfg.label)}</span></div>
      <div class="kpi-value">${cfg.pendingNote ? "Not recorded yet" : "No data"}</div><p>${esc(cfg.pendingNote || "Not returned by the scorecard rollup for this range.")}</p></div>`;
  }
  const goal = effectiveGoal(m, cfg);
  const i = lastIndex(m.series);
  const value = i >= 0 ? m.series[i].value : null;
  const last13 = m.series.slice(-13);
  const delta = yoyDelta(m, goal);
  const chart = last13.some(s => s.value != null)
    ? lineChart({ series: [{ name: cfg.label, color: "var(--series-1)", values: last13.map(s => s.value) }],
                  labels: last13.map(s => monthLabel(s.period_date, false)), unit: m.unit, goal,
                  width: 300, height: 92, compact: true, interactive: false, xEvery: 3 })
    : `<div class="kpi-delta">No history in this range</div>`;
  return `<a class="kpi-card" href="#m=${encodeURIComponent(cfg.key)}" aria-label="${esc(cfg.label)} — open detail">
    <div class="kpi-head"><span class="kpi-label">${esc(cfg.label)}</span><span class="kpi-month">${i >= 0 ? monthLabel(m.series[i].period_date) : ""}</span></div>
    <div class="kpi-value-row"><span class="kpi-value">${fmtValue(value, m.unit, { compact: true })}</span>${statusHtml(value, goal, m.unit)}</div>
    <div class="kpi-goal">${esc(goalText(goal, m.unit))}${m.grain === "office" && !document.getElementById("filter-office").value ? " · all offices" : ""}${i >= 0 && isLegacy(m, m.series[i].period_date) ? " · legacy count" : ""}</div>
    <div class="kpi-delta">${delta || "No year-earlier month to compare"}</div>
    <div class="kpi-chart">${chart}</div>
  </a>`;
}

// ════════════════════════════════════════════════════════════════════════════
// Detail page — one indicator, in depth
// ════════════════════════════════════════════════════════════════════════════
function renderDetail(key) {
  const m = _metrics[key];
  const cfg = SCORECARD_BY_KEY[key] || null;
  const back = `<a class="detail-back" href="#">← Scorecard</a>`;
  if (!m) return `${back}<div class="empty-state">That metric isn't in this report.</div>`;
  const label = cfg ? cfg.label : m.display_name;
  const goal = effectiveGoal(m, cfg);
  const range = Number(document.getElementById("filter-range").value);
  const series = m.series.slice(-range);
  const i = lastIndex(m.series);
  const value = i >= 0 ? m.series[i].value : null;
  const prev = i >= 1 ? m.series[i - 1].value : null;
  const delta = yoyDelta(m, goal);
  const avg12 = (() => { const v = m.series.slice(Math.max(0, i - 11), i + 1).map(s => s.value).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; })();
  const editable = !m.derived && m.metric_key.indexOf("derived_") !== 0;

  const mainHtml = lineChart({
    series: [{ name: label, color: "var(--series-1)", values: series.map(s => s.value) }],
    labels: series.map(s => shortMonth(s.period_date)), tipLabels: series.map(s => monthLabel(s.period_date)),
    unit: m.unit, goal, width: 760, height: 300,
  });

  return `${back}
    <div class="detail-head">
      <div>
        <h1>${esc(label)}</h1>
        <div class="detail-sub">${esc(goalText(goal, m.unit))}${goal && goal.source === "scorecard" ? " (scorecard target)" : ""}${m.grain === "office" ? ` · ${document.getElementById("filter-office").value ? esc(officeName()) : "all offices"}` : " · company-wide"}${m.derived ? " · calculated from the supporting numbers below" : ""}
          ${editable ? ` · <button class="breakdown-toggle" onclick="openGoalEdit('${esc(m.metric_key)}')">Edit goal</button>` : ""}</div>
        <div id="goal-edit"></div>
        ${(m.legacy_months || []).length ? `<div class="detail-sub">Months marked “legacy” use the old Listing Videos count — every listing, any video link — so the step to the live Daily Desk measure isn’t a like-for-like change.</div>` : ""}
      </div>
      <div class="detail-stats">
        <div class="stat"><div class="stat-label">${i >= 0 ? monthLabel(m.series[i].period_date) : "Latest"}</div><div class="stat-value">${fmtValue(value, m.unit)} ${statusHtml(value, goal, m.unit)}</div></div>
        <div class="stat"><div class="stat-label">Prior month</div><div class="stat-value">${fmtValue(prev, m.unit)}</div></div>
        <div class="stat"><div class="stat-label">12-month average</div><div class="stat-value">${fmtValue(avg12, m.unit)}</div></div>
        <div class="stat"><div class="stat-label">Year over year</div><div class="stat-value" style="font-size:.85rem;font-weight:500;padding-top:.3rem">${delta || "—"}</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">By month, last ${range} months</div>
      <div class="panel-sub">Hover for each month's value. The line marks the goal.</div>
      ${mainHtml}
    </div>

    ${renderYoyPanel(m, label, goal)}
    ${m.grain === "office" ? `<div class="panel" id="office-panel"><div class="panel-title">By office</div><div class="loading">Loading offices…</div></div>` : ""}
    ${renderSupport(cfg, m)}
    ${renderMonthTable(m, cfg, label, goal, range)}`;
}

function officeName() {
  const sel = document.getElementById("filter-office");
  return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
}

// Each calendar year as its own line over Jan–Dec: the seasonal view. Current
// year in the accent, earlier years in the next categorical slots, with a
// legend (two or more series) and end labels.
function renderYoyPanel(m, label, goal) {
  const byYear = {};
  for (const s of m.series) {
    if (s.value == null) continue;
    const [y, mo] = s.period_date.split("-").map(Number);
    (byYear[y] ||= Array(12).fill(null))[mo - 1] = s.value;
  }
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a).slice(0, 3);
  if (years.length < 2) return "";
  const colors = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
  const series = years.map((y, k) => ({ name: String(y), color: colors[k], values: byYear[y], width: k === 0 ? 2.5 : 2 }));
  return `<div class="panel">
    <div class="panel-title">Year over year</div>
    <div class="panel-sub">Each year's months side by side, so a seasonal dip reads as seasonal.</div>
    <div class="legend">${series.map(s => `<span><i class="legend-key" style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>
    ${lineChart({ series, labels: MON.slice(), unit: m.unit, goal, width: 760, height: 260, xEvery: 1 })}
  </div>`;
}

const SUPPORT_LABELS = {
  "Total-Closings": "Total Closings", "reviews_total": "Total Reviews", "reviews_positive": "Positive Reviews",
};
function renderSupport(cfg, m) {
  const keys = (cfg && cfg.support) || [];
  const range = Number(document.getElementById("filter-range").value);
  const panels = keys.map(k => _metrics[k]).filter(Boolean).map(s => {
    const ser = s.series.slice(-range);
    if (!ser.some(p => p.value != null)) return "";
    const lbl = (SCORECARD_BY_KEY[s.metric_key] && SCORECARD_BY_KEY[s.metric_key].label) || s.display_name;
    return `<div>
      <div class="multiple-title">${SCORECARD_BY_KEY[s.metric_key] ? `<a class="metric-link" href="#m=${encodeURIComponent(s.metric_key)}">${esc(lbl)} →</a>` : esc(lbl)}<span>${fmtValue(ser[lastIndex(ser)]?.value, s.unit)}</span></div>
      ${lineChart({ series: [{ name: lbl, color: "var(--series-1)", values: ser.map(p => p.value) }], labels: ser.map(p => shortMonth(p.period_date)), tipLabels: ser.map(p => monthLabel(p.period_date)), unit: s.unit, width: 300, height: 130, compact: true })}
    </div>`;
  }).join("");
  if (!panels) return "";
  return `<div class="panel"><div class="panel-title">Supporting numbers</div>
    <div class="panel-sub">The figures behind this indicator, same months as above.</div>
    <div class="support-grid">${panels}</div></div>`;
}

// The table view: every month's value (and its supporting numbers) without
// needing to hover — newest first.
function renderMonthTable(m, cfg, label, goal, range) {
  const support = ((cfg && cfg.support) || []).map(k => _metrics[k]).filter(Boolean);
  const rows = m.series.slice(-range).map((p, idx) => ({ p, idx })).reverse();
  return `<div class="panel"><div class="panel-title">Month by month</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Month</th><th class="num">${esc(label)}</th>${goal ? "<th>Goal</th>" : ""}${support.map(s => `<th class="num">${esc((SCORECARD_BY_KEY[s.metric_key] && SCORECARD_BY_KEY[s.metric_key].label) || s.display_name)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(({ p }) => {
        const meets = meetsGoal(p.value, goal);
        return `<tr><td>${monthLabel(p.period_date)}${isLegacy(m, p.period_date) ? ' <span class="goal-none">· legacy</span>' : ""}</td><td class="num">${fmtValue(p.value, m.unit)}</td>${goal ? `<td>${meets == null ? "" : meets ? '<span class="status ok">✓ On goal</span>' : `<span class="status low">✗ ${goal.direction === "above" ? "Below" : "Over"}</span>`}</td>` : ""}${support.map(s => {
          const sp = s.series.find(x => x.period_date === p.period_date);
          return `<td class="num">${fmtValue(sp ? sp.value : null, s.unit)}</td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody>
    </table></div></div>`;
}

// Office small multiples — one chart per office on a shared y-scale, so
// offices compare by eye without seven overlapping lines.
async function loadOfficePanel(key) {
  const m = _metrics[key];
  if (!m || m.grain !== "office") return;
  const end = document.getElementById("filter-month").value;
  const cacheKey = `${key}|${end}`;
  let data = _officeCache[cacheKey];
  try {
    if (!data) data = _officeCache[cacheKey] = await GET(`/scorecard/metrics/trend/by-office?${new URLSearchParams({ metric_key: key, end_month: end, months: MONTHS_FETCHED })}`);
  } catch (e) {
    const p = document.getElementById("office-panel");
    if (p) p.innerHTML = `<div class="panel-title">By office</div><div class="empty-state" style="color:var(--red)">Error: ${esc(e.message)}</div>`;
    return;
  }
  const panel = document.getElementById("office-panel");
  if (!panel || currentRoute().key !== key) return;
  const range = Number(document.getElementById("filter-range").value);
  const cfg = SCORECARD_BY_KEY[key];
  const goal = effectiveGoal(m, cfg);
  const offices = data.offices.filter(o => o.series.slice(-range).some(p => p.value != null));
  if (!offices.length) { panel.innerHTML = `<div class="panel-title">By office</div><div class="empty-state">No office-level data in this range.</div>`; return; }
  const all = offices.flatMap(o => o.series.slice(-range).map(p => p.value)).filter(v => v != null);
  const domain = m.unit === "percent" ? [0, 100] : [Math.min(0, ...all), Math.max(...all, goal ? goal.value : 0)];
  panel.innerHTML = `<div class="panel-title">By office</div>
    <div class="panel-sub">Same scale on every chart.${offices[0].recorded ? " The count under each office is its latest month's matched of recorded closings — a small count means a jumpy rate." : ""}</div>
    <div class="multiples">${offices.map(o => {
      const ser = o.series.slice(-range);
      const li = lastIndex(ser);
      const rec = o.recorded ? o.recorded.slice(-range) : null, mat = o.matched ? o.matched.slice(-range) : null;
      const sample = rec && li >= 0 && rec[li].value != null ? ` · ${mat[li].value ?? 0} of ${rec[li].value}` : "";
      return `<div><div class="multiple-title">${esc(o.office_name)}<span>${li >= 0 ? fmtValue(ser[li].value, m.unit) + sample : "—"}</span></div>
        ${lineChart({ series: [{ name: o.office_name, color: "var(--series-1)", values: ser.map(p => p.value) }], labels: ser.map(p => shortMonth(p.period_date)), tipLabels: ser.map(p => monthLabel(p.period_date)), unit: m.unit, goal, width: 300, height: 130, compact: true, yDomain: domain })}
      </div>`;
    }).join("")}</div>`;
}

// ── Goal editing (stored metrics only; computed ratios carry a fixed goal) ──
function openGoalEdit(metricKey) {
  const m = _metrics[metricKey];
  const goal = effectiveGoal(m, SCORECARD_BY_KEY[metricKey]);
  document.getElementById("goal-edit").innerHTML = `
    <div class="goal-edit-row">
      <input type="number" step="any" id="goal-value" value="${goal ? goal.value : ""}" placeholder="value">
      <select id="goal-dir">
        <option value="above" ${!goal || goal.direction === "above" ? "selected" : ""}>≥ higher is better</option>
        <option value="below" ${goal && goal.direction === "below" ? "selected" : ""}>≤ lower is better</option>
        <option value="none">No goal</option>
      </select>
      <button class="btn btn-sm" onclick="saveGoal('${esc(metricKey)}')">Save</button>
      <button class="btn btn-sm" onclick="document.getElementById('goal-edit').innerHTML=''">Cancel</button>
    </div>`;
  document.getElementById("goal-value").focus();
}

async function saveGoal(metricKey) {
  const target_direction = document.getElementById("goal-dir").value;
  const rawValue = document.getElementById("goal-value").value.trim();
  const target_value = (target_direction === "none" || rawValue === "") ? null : Number(rawValue);
  if (target_value != null && !Number.isFinite(target_value)) { alert("Enter a valid number."); return; }
  try {
    await api(`/scorecard/admin/metric-catalog/${encodeURIComponent(metricKey)}`, {
      method: "PATCH",
      body: JSON.stringify({ target_value, target_direction }),
    });
    const m = _metrics[metricKey];
    if (m) { m.target_value = target_value; m.target_direction = target_direction; }
    render();
  } catch (e) {
    alert("Could not save goal: " + e.message);
  }
}

// ════════════════════════════════════════════════════════════════════════════
// All metrics — every metric the rollup collects, grouped as before; each
// links to its own detail page.
// ════════════════════════════════════════════════════════════════════════════
function renderAllMetrics() {
  const groups = _data.groups.map(g => ({ ...g, metrics: g.metrics.filter(m => !m.supporting) })).filter(g => g.metrics.length);
  if (!groups.length) return '<div class="empty-state">No metrics configured yet.</div>';
  return `<p class="filters-note" style="margin-bottom:1rem">Everything the monthly rollup collects, including what isn't on the scorecard. Click a metric for its detail page.</p>` +
    groups.map(g => `
    <div class="metric-group">
      <div class="section-title">${esc(g.group)}</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Metric</th><th>Latest</th><th class="num">Last 12 months</th><th>Goal</th></tr></thead>
          <tbody>${g.metrics.map(m => {
            const cfg = SCORECARD_BY_KEY[m.metric_key];
            const goal = effectiveGoal(m, cfg);
            const i = lastIndex(m.series);
            const v = i >= 0 ? m.series[i].value : null;
            const meets = meetsGoal(v, goal);
            const last12 = m.series.slice(-12);
            return `<tr>
              <td><a class="metric-link" href="#m=${encodeURIComponent(m.metric_key)}">${esc(m.display_name)}</a>${cfg ? ' <span class="goal-none">· scorecard</span>' : ""}${m.detail ? `<div class="metric-detail">${esc(m.detail)}</div>` : ""}</td>
              <td class="${meets == null ? "" : meets ? "rate-ok" : "rate-low"}">${fmtValue(v, m.unit)}${i >= 0 ? `<div class="metric-detail">${monthLabel(m.series[i].period_date)}</div>` : ""}</td>
              <td style="width:240px">${last12.some(p => p.value != null) ? lineChart({ series: [{ name: m.display_name, color: "var(--series-1)", values: last12.map(p => p.value) }], labels: last12.map(p => monthLabel(p.period_date, false)), unit: m.unit, goal, width: 240, height: 56, compact: true, interactive: false, endLabels: false, xEvery: 11 }) : '<span class="goal-none">No history</span>'}</td>
              <td><span class="${goal ? "goal-set" : "goal-none"}">${esc(goalText(goal, m.unit))}</span></td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </div>`).join("");
}
